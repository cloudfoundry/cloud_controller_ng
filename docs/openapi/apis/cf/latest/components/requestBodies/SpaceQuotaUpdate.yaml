description: Space quota to update
required: true
content:
  application/json:
    schema:
      $ref: '../schemas/SpaceQuotaUpdate.yaml'
    examples:
      default:
        summary: default
        value:
          name: don-quixote
          apps:
            total_memory_in_mb: 5120
            per_process_memory_in_mb: 1024
            log_rate_limit_in_bytes_per_second: 1024
            total_instances: 10
            per_app_tasks: 5
          services:
            paid_services_allowed: true
            total_service_instances: 10
            total_service_keys: 20
          routes:
            total_routes: 8
            total_reserved_ports: 4
