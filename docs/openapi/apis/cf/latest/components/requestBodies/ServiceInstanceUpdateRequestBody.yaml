description: |-
  A request to update a service instance.

  The permitted parameters differ between `managed` and `user-provided` service instances.
required: true
content:
  application/json:
    schema:
      anyOf:
        - $ref: ../schemas/ManagedServiceInstanceUpdate.yaml
        - $ref: ../schemas/UserProvidedServiceInstanceUpdate.yaml
    examples:
      managed_service_instance:
        summary: Update managed service instance
        value:
          name: my_service_instance
          parameters:
            foo: bar
            baz: qux
          tags:
            - foo
            - bar
            - baz
          relationships:
            service_plan:
              data:
                guid: f2b6ba9c-a4d2-11ea-8ae6-48bf6bec2d78
          metadata:
            annotations:
              note: detailed information
            labels:
              key: value
      managed_service_instance_upgrade:
        summary: Upgrade managed service instance (maintenance_info update)
        value:
          maintenance_info:
            version: 2.1.1
      user_provided_service_instance:
        summary: Update user-provided service instance
        value:
          name: my_service_instance
          credentials:
            foo: bar
            baz: qux
          tags:
            - foo
            - bar
            - baz
          syslog_drain_url: https://syslog.com/drain
          route_service_url: https://route.com/service
          metadata:
            annotations:
              foo: bar
            labels:
              baz: qux
      default:
        summary: default
        value:
          name: my_service_instance
          credentials:
            foo: bar
            baz: qux
          tags:
            - foo
            - bar
            - baz
          syslog_drain_url: https://syslog.com/drain
          route_service_url: https://route.com/service
          metadata:
            annotations:
              foo: bar
            labels:
              baz: qux
