description: |-
  Package object that needs to be created. When the `source_guid` query parameter is supplied the package is copied instead, and `relationships.app` (the destination app) is the only accepted parameter.
required: true
content:
  application/json:
    schema:
      type: object
      properties:
        type:
          type: string
          description: Type of the package; valid values are `bits`, `docker`. Required when creating a package; not accepted when copying a package (when `source_guid` is supplied)
          enum:
            - bits
            - docker
        relationships:
          type: object
          properties:
            app:
              $ref: ../schemas/RelationshipToOne.yaml
              description: A relationship to an app
          required:
            - app
        data:
          type: object
          default: {}
          description: Data for package type; not accepted when copying a package
          properties:
            image:
              type: string
              description: Required when `type` is `docker`; the registry address of the image
            username:
              type: string
              description: Optional when `type` is `docker` and accessing a secured registry
            password:
              type: string
              description: Optional when `type` is `docker` and accessing a secured registry
        metadata:
          $ref: ../schemas/Metadata.yaml
          description: Labels and annotations applied to the package
      required:
        - relationships
      description: Request schema for creating or copying a package
    examples:
      buildpack_app:
        summary: buildpack app
        value:
          type: bits
          relationships:
            app:
              data:
                guid: 123e4567-e89b-12d3-a456-426614174000
      docker_app:
        summary: Docker app
        value:
          type: docker
          relationships:
            app:
              data:
                guid: 123e4567-e89b-12d3-a456-426614174000
          data:
            image: registry/image:latest
            username: username
            password: password
      copy:
        summary: copy (with the source_guid query parameter)
        value:
          relationships:
            app:
              data:
                guid: 36208a68-562d-4f51-94ea-28bd8553a271
