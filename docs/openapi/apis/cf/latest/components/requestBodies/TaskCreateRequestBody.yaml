description: The task to create
required: true
content:
  application/json:
    schema:
      type: object
      properties:
        command:
          type: string
          description: |-
            Command that will be executed; **NOTE:** optional if a `template.process.guid` is provided.

            If not provided, and a `template.process.guid` is provided, this field will use the value from the process with the given guid.
        name:
          type: string
          description: Name of the task; defaults to an auto-generated name
        user:
          type: string
          description: OS user used to run the task in the runtime
          default: vcap
        disk_in_mb:
          type: integer
          description: |-
            Amount of disk to allocate for the task in MB; defaults to the operator-configured `default_app_disk_in_mb`.

            If not provided, and a `template.process.guid` is provided, this field will use the value from the process with the given guid.
        memory_in_mb:
          type: integer
          description: |-
            Amount of memory to allocate for the task in MB; defaults to the operator-configured `default_app_memory`.

            If not provided, and a `template.process.guid` is provided, this field will use the value from the process with the given guid.
        log_rate_limit_in_bytes_per_second:
          type: integer
          description: |-
            Amount of log rate to allocate for the task in bytes; defaults to the operator-configured `default_app_log_rate_limit_in_bytes_per_second`.

            If not provided, and a `template.process.guid` is provided, this field will use the value from the process with the given guid.
        droplet_guid:
          type: string
          format: uuid
          description: The guid of the droplet that will be used to run the command; defaults to the app's current droplet
        template:
          type: object
          description: An object that describes a process to template the task from
          properties:
            process:
              type: object
              description: The process that will be used as a template
              properties:
                guid:
                  type: string
                  format: uuid
                  description: The guid of the process that will be used as a template; defaults to `null`
              required:
                - guid
        metadata:
          $ref: ../schemas/Metadata.yaml
          description: |-
            `labels`: Labels applied to the package

            `annotations`: Annotations applied to the package
      description: Request schema for creating a task
    examples:
      default:
        summary: with command
        value:
          command: rake db:migrate
      template:
        summary: with template process
        value:
          template:
            process:
              guid: 89323d4e-2e84-43e7-83e9-adbf50a20c0e
