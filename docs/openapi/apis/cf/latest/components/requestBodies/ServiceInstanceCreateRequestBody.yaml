description: |-
  A request to create a service instance.

  Service instances can be of type `managed` or `user-provided`, and the required parameters are different for each type.
required: true
content:
  application/json:
    schema:
      oneOf:
        - $ref: ../schemas/ManagedServiceInstanceCreate.yaml
        - $ref: ../schemas/UserProvidedServiceInstanceCreate.yaml
      discriminator:
        propertyName: type
        mapping:
          managed: ../schemas/ManagedServiceInstanceCreate.yaml
          user-provided: ../schemas/UserProvidedServiceInstanceCreate.yaml
    examples:
      managed_service_instance:
        summary: Managed service instance
        value:
          type: managed
          name: my_service_instance
          parameters:
            foo: bar
            baz: qux
          tags:
            - foo
            - bar
            - baz
          metadata:
            annotations:
              foo: bar
            labels:
              baz: qux
          relationships:
            space:
              data:
                guid: 7304bc3c-7010-11ea-8840-48bf6bec2d78
            service_plan:
              data:
                guid: e0e4417c-74ee-11ea-a604-48bf6bec2d78
      user_provided_service_instance:
        summary: User-provided service instance
        value:
          type: user-provided
          name: my_service_instance
          credentials:
            foo: bar
            baz: qux
          tags:
            - foo
            - bar
            - baz
          syslog_drain_url: https://syslog.com/drain
          route_service_url: https://route.com/service
          metadata:
            annotations:
              foo: bar
            labels:
              baz: qux
          relationships:
            space:
              data:
                guid: 7304bc3c-7010-11ea-8840-48bf6bec2d78
      default:
        summary: default
        value:
          type: user-provided
          name: my_service_instance
          credentials:
            foo: bar
            baz: qux
          tags:
            - foo
            - bar
            - baz
          syslog_drain_url: https://syslog.com/drain
          route_service_url: https://route.com/service
          metadata:
            annotations:
              foo: bar
            labels:
              baz: qux
          relationships:
            space:
              data:
                guid: 123e4567-e89b-12d3-a456-426614174000
