description: |-
  A request to create a service instance.

  Service instances can be of type `managed` or `user-provided`, and the required parameters are different for each type.
content:
  application/json:
    schema:
      type: object
      properties:
        type:
          type: string
          enum:
            - managed
            - user-provided
          description: Type of the service instance; `managed` or `user-provided`
        name:
          type: string
          description: Name of the service instance; must be unique within the space (case-sensitive)
        tags:
          type: array
          items:
            type: string
          description: Tags are used by apps to identify service instances; they are shown in the app VCAP_SERVICES env
        parameters:
          type: object
          description: A JSON object that is passed to the service broker
        relationships:
          type: object
          properties:
            space:
              $ref: ../schemas/RelationshipToOne.yaml
              description: The space in which to create the service instance
            service_plan:
              $ref: ../schemas/RelationshipToOne.yaml
              description: The service plan from which to create the service instance
          description: Relationships for the service instance
        metadata:
          $ref: ../schemas/Metadata.yaml
          description: Labels and annotations applied to the service instance
        credentials:
          type: object
          description: A JSON object that is made available to apps bound to this service instance
        syslog_drain_url:
          type: string
          description: URL to which logs for bound applications will be streamed
        route_service_url:
          type: string
          description: URL to which requests for bound routes will be forwarded; must use the `https` protocol
      required:
        - type
        - name
        - relationships
      oneOf:
        - $ref: ../schemas/ManagedServiceInstanceCreate.yaml
        - $ref: ../schemas/UserProvidedServiceInstanceCreate.yaml
      discriminator:
        propertyName: type
        mapping:
          managed: ../schemas/ManagedServiceInstanceCreate.yaml
          user-provided: ../schemas/UserProvidedServiceInstanceCreate.yaml
      description: The fields accepted when creating a service instance. `parameters` and `relationships.service_plan` apply only to `managed` service instances; `credentials`, `syslog_drain_url` and `route_service_url` apply only to `user-provided` service instances.
    examples:
      managed_service_instance:
        summary: Managed service instance
        value:
          type: managed
          name: my_service_instance
          parameters:
            foo: bar
            baz: qux
          tags:
            - foo
            - bar
            - baz
          metadata:
            annotations:
              foo: bar
            labels:
              baz: qux
          relationships:
            space:
              data:
                guid: 7304bc3c-7010-11ea-8840-48bf6bec2d78
            service_plan:
              data:
                guid: e0e4417c-74ee-11ea-a604-48bf6bec2d78
      user_provided_service_instance:
        summary: User-provided service instance
        value:
          type: user-provided
          name: my_service_instance
          credentials:
            foo: bar
            baz: qux
          tags:
            - foo
            - bar
            - baz
          syslog_drain_url: https://syslog.com/drain
          route_service_url: https://route.com/service
          metadata:
            annotations:
              foo: bar
            labels:
              baz: qux
          relationships:
            space:
              data:
                guid: 7304bc3c-7010-11ea-8840-48bf6bec2d78
      default:
        summary: default
        value:
          type: user-provided
          name: my_service_instance
          credentials:
            foo: bar
            baz: qux
          tags:
            - foo
            - bar
            - baz
          syslog_drain_url: https://syslog.com/drain
          route_service_url: https://route.com/service
          metadata:
            annotations:
              foo: bar
            labels:
              baz: qux
          relationships:
            space:
              data:
                guid: 123e4567-e89b-12d3-a456-426614174000
