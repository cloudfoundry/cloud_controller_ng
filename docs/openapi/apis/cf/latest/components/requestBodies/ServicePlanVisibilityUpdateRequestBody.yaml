description: Service plan visibility object that needs to be updated
required: true
content:
  application/json:
    schema:
      type: object
      properties:
        type:
          type: string
          enum:
            - public
            - admin
            - organization
          description: Denotes the visibility of the plan; can be `public`, `admin`, `organization`, see [_list of visibility types_](#list-of-visibility-types)
        organizations:
          type: array
          description: Desired list of organizations GUIDs where the plan will be accessible; required if `type` is `organization`
          items:
            type: object
            properties:
              guid:
                type: string
                format: uuid
                description: Unique identifier for the organization where the plan will be available
            required:
              - guid
      required:
        - type
    examples:
      default:
        summary: default
        value:
          type: organization
          organizations:
            - guid: 0fc1ad4f-e1d7-4436-8e23-6b20f03c6482
