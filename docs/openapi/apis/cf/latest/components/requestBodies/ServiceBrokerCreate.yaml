description: Service broker to create
required: true
content:
  application/json:
    schema:
      type: object
      properties:
        name:
          type: string
          description: Name of the service broker; must be unique (case-sensitive)
        url:
          type: string
          format: uri
          description: URL of the service broker
        authentication:
          $ref: ../schemas/ServiceBrokerAuthentication.yaml
          description: Credentials used to authenticate against the service broker
        relationships:
          type: object
          description: Relationships for the service broker
          properties:
            space:
              $ref: ../schemas/RelationshipToOne.yaml
              description: If set, restricts the service broker to the specified space
        metadata:
          $ref: ../schemas/Metadata.yaml
          description: Labels and annotations applied to the service broker
      required:
        - name
        - url
        - authentication
    examples:
      default:
        summary: default
        value:
          name: my_service_broker
          url: https://example.service-broker.com
          authentication:
            type: basic
            credentials:
              username: us3rn4me
              password: p4ssw0rd
          relationships:
            space:
              data:
                guid: 2f35885d-0c9d-4423-83ad-fd05066f8576
