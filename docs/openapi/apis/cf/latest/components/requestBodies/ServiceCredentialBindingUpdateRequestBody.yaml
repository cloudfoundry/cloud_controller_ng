description: A request to update a service credential binding
required: true
content:
  application/json:
    schema:
      type: object
      properties:
        metadata:
          $ref: ../schemas/Metadata.yaml
          description: Labels and annotations applied to the service credential binding
    examples:
      update_binding:
        summary: Update service credential binding
        value:
          metadata:
            labels:
              foo: bar
            annotations:
              baz: qux
      default:
        summary: default
        value:
          metadata:
            labels:
              foo: bar
            annotations:
              baz: qux
