description: The desired scale for the process
required: true
content:
  application/json:
    schema:
      type: object
      properties:
        instances:
          type:
            - integer
            - 'null'
          description: The number of instances to run
        memory_in_mb:
          type:
            - integer
            - 'null'
          description: The memory in mb allocated per instance
        disk_in_mb:
          type:
            - integer
            - 'null'
          description: The disk in mb allocated per instance
        log_rate_limit_in_bytes_per_second:
          type:
            - integer
            - 'null'
          description: The log rate in bytes per second allocated per instance
      description: Request schema for scaling a process
    examples:
      default:
        summary: default
        value:
          instances: 5
          memory_in_mb: 256
          disk_in_mb: 1024
          log_rate_limit_in_bytes_per_second: 1024
