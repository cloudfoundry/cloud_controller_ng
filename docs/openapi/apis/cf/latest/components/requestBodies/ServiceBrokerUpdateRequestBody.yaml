description: Service broker object that needs to be updated
required: true
content:
  application/json:
    schema:
      type: object
      properties:
        name:
          type: string
          description: Name of the service broker
        url:
          type: string
          format: uri
          description: URL of the service broker
        authentication:
          $ref: ../schemas/ServiceBrokerAuthentication.yaml
          description: Credentials used to authenticate against the service broker
        metadata:
          $ref: ../schemas/Metadata.yaml
          description: Labels and annotations applied to the service broker
    examples:
      default:
        summary: default
        value:
          name: my_service_broker
          url: https://example.service-broker.com
          authentication:
            type: basic
            credentials:
              username: us3rn4me
              password: p4ssw0rd
          metadata:
            labels:
              key: value
            annotations:
              note: detailed information
