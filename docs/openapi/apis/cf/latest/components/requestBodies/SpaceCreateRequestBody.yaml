description: Space object that needs to be created
required: true
content:
  application/json:
    schema:
      type: object
      description: Request schema for creating a space
      properties:
        name:
          type: string
          description: Space name; must be unique within the organization (case-insensitive)
        suspended:
          type: boolean
          description: Whether a space is suspended or not
        relationships:
          type: object
          description: Relationships for the space
          properties:
            organization:
              $ref: ../schemas/RelationshipToOne.yaml
              description: A relationship to an organization
          required:
            - organization
        metadata:
          $ref: ../schemas/Metadata.yaml
          description: Labels and annotations applied to the space
      required:
        - name
        - relationships
    examples:
      default:
        summary: default
        value:
          name: my-space
          relationships:
            organization:
              data:
                guid: e00705b9-7b42-4561-ae97-2520399d2133
