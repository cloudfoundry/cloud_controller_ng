description: Organization object that needs to be updated
required: true
content:
  application/json:
    schema:
      type: object
      description: Request schema for updating an organization
      properties:
        name:
          type: string
          description: Organization name
        suspended:
          type: boolean
          description: Whether an organization is suspended or not
        metadata:
          $ref: ../schemas/Metadata.yaml
          description: Labels and annotations applied to the organization
    examples:
      default:
        summary: default
        value:
          name: my-organization
