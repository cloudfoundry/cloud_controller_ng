description: Route to create
required: true
content:
  application/json:
    schema:
      type: object
      properties:
        host:
          type: string
          description: The host component for the route; not compatible with routes specifying the `tcp` protocol
        path:
          type: string
          description: The path component for the route; should begin with a `/` and not compatible with routes specifying the `tcp` protocol
        port:
          type: integer
          description: The port the route will listen on; only compatible with routes leveraging a domain that supports the `tcp` protocol. For `tcp` domains, a port will be randomly assigned if not specified
        relationships:
          type: object
          properties:
            domain:
              $ref: ../schemas/RelationshipToOne.yaml
              description: A relationship to the domain of the route
            space:
              $ref: ../schemas/RelationshipToOne.yaml
              description: A relationship to the space containing the route; routes can only be mapped to destinations in that space
          required:
            - domain
            - space
          description: Relationships to the space and domain of the route
        options:
          $ref: ../schemas/RouteOptions.yaml
          description: Options applied to the route
        metadata:
          $ref: ../schemas/Metadata.yaml
          description: Labels and annotations applied to the route
      required:
        - relationships
    examples:
      default:
        summary: default
        value:
          host: a-hostname
          path: /some_path
          port: 6666
          relationships:
            domain:
              data:
                guid: 0b5f3633-194c-42d2-9408-972366617e0e
            space:
              data:
                guid: 885a8cb3-c07b-4856-b448-eeb10bf36236
          options:
            loadbalancing: round-robin
          metadata:
            labels:
              key: value
            annotations:
              note: detailed information
      hash-based-routing:
        summary: Example with hash-based routing
        description: Creates a route that uses hash-based routing on the `X-User-ID` header with a load balance factor of 5.0.
        value:
          host: user-specific-app
          relationships:
            domain:
              data:
                guid: 0b5f3633-194c-42d2-9408-972366617e0e
            space:
              data:
                guid: 885a8cb3-c07b-4856-b448-eeb10bf36236
          options:
            loadbalancing: hash
            hash_header: X-User-ID
            hash_balance: '5.0'
