type: object
properties:
  protocol:
    type: string
    enum:
      - tcp
      - udp
      - icmp
      - icmpv6
      - all
    description: Protocol type Valid values are `tcp`, `udp`, `icmp`, `icmpv6` or `all`
  destination:
    type: string
    description: |-
      The destination where the rule applies. Must be a singular valid CIDR, IP address, or IP address range unless `cc.security_groups.enable_comma_delimited_destinations` is enabled. Then, the destination can be a comma-delimited string of CIDRs, IP addresses, or IP address ranges. Octets within IPv4 destinations cannot contain leading zeros; eg. `10.0.0.0/24` is valid, but `010.00.000.0/24` is *not*. For `icmp`, only IPv4 addresses are allowed and for `icmpv6` only IPv6 addresses.
  ports:
    type: [string, "null"]
    default: null
    description: Ports that the rule applies to; can be a single port (`9000`), a comma-separated list (`9000,9001`), or a range (`9000-9200`)
  type:
    type: [integer, "null"]
    minimum: -1
    maximum: 255
    default: null
    description: |-
      [Type](https://www.iana.org/assignments/icmp-parameters/icmp-parameters.xhtml#icmp-parameters-types) required for ICMP protocol; valid values are between -1 and 255 (inclusive), where -1 allows all
  code:
    type: [integer, "null"]
    minimum: -1
    maximum: 255
    default: null
    description: |-
      [Code](https://www.iana.org/assignments/icmp-parameters/icmp-parameters.xhtml#icmp-parameters-codes) required for ICMP protocol; valid values are between -1 and 255 (inclusive), where -1 allows all
  description:
    type: [string, "null"]
    default: null
    description: A description for the rule; this field is limited to 16MB
  log:
    type: [boolean, "null"]
    default: null
    description: Enable logging for rule, only valid for tcp rules
required:
  - protocol
  - destination
description: |-
  An egress traffic rule applied by a security group.
