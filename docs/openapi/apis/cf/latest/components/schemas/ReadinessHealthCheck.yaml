type: object
properties:
  type:
    type: string
    enum: ["http", "port", "process"]
    default: process
    description: The type of health check to perform; valid values are `http`, `port`, and `process`; default is `process`
  data:
    type: object
    description: Configuration for the readiness health check
    properties:
      invocation_timeout:
        type: [integer, 'null']
        description: The timeout in seconds for individual health check requests for `http` and `port` health checks
      interval:
        type: [integer, 'null']
        description: The interval in seconds between health check requests
      endpoint:
        type: [string, 'null']
        description: The endpoint called to determine if the app is ready; this key is only present for `http` health checks
description: 'The readiness health check to perform on the process'
