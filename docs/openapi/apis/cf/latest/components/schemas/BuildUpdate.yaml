type: object
properties:
  state:
    type: string
    description: Build status; valid values are `FAILED` or `STAGED` (field can only be passed by Build State Updaters)
    enum:
      - STAGED
      - FAILED
  error:
    type: [string, 'null']
    description: A string describing errors during the build process (field can only be passed by Build State Updaters)
  lifecycle:
    type: object
    description: Lifecycle information for the build (field can only be passed by Build State Updaters)
    properties:
      type:
        type: string
        description: Type of the lifecycle; valid values are `buildpack`, `cnb`, `docker`
      data:
        type: object
        description: Data specific to the lifecycle
        properties:
          image:
            type: string
            description: Image reference tag where the built complete image was stored (field can only be passed by Build State Updaters)
          processTypes:
            type: object
            additionalProperties:
              type: string
            description: Process types detected during staging, keyed by process type (field can only be passed by Build State Updaters)
  metadata:
    $ref: './Metadata.yaml'
    description: Labels and annotations applied to the build
description: Request schema for updating a build
