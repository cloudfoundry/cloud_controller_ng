type: object
allOf:
  - $ref: './BaseSchema.yaml'
  - properties:
      guid:
        type: string
        format: uuid
        description: Unique identifier for the event
      created_at:
        type: string
        format: date-time
        description: The time with zone when the event occurred
      updated_at:
        type: string
        format: date-time
        description: Identical to `created_at` (events are created, never updated)
      state:
        type: [string, "null"]
        description: Current state of the service that this event pertains to, if applicable
      space:
        type: object
        description: The space that this event pertains to
        properties:
          guid:
            type: [string, "null"]
            description: Unique identifier of the space that this event pertains to, if applicable
          name:
            type: [string, "null"]
            description: Name of the space that this event pertains to, if applicable
      organization:
        type: object
        description: The organization that this event pertains to
        properties:
          guid:
            type: [string, "null"]
            description: Unique identifier of the org that this event pertains to, if applicable
      service_instance:
        type: object
        description: The service instance that this event pertains to
        properties:
          guid:
            type: [string, "null"]
            description: Unique identifier of the service instance that this event pertains to, if applicable
          name:
            type: [string, "null"]
            description: Name of the service instance that this event pertains to, if applicable
          type:
            type: [string, "null"]
            description: Type of the service instance that this event pertains to, if applicable; valid values are `managed_service_instance` and `user_provided_service_instance`
      service_plan:
        type: object
        description: The service plan that this event pertains to
        properties:
          guid:
            type: [string, "null"]
            description: Unique identifier of the service plan that this event pertains to, if applicable
          name:
            type: [string, "null"]
            description: Name of the service plan that this event pertains to, if applicable
      service_offering:
        type: object
        description: The service offering that this event pertains to
        properties:
          guid:
            type: [string, "null"]
            description: Unique identifier of the service offering that this event pertains to, if applicable
          name:
            type: [string, "null"]
            description: Name of the service offering that this event pertains to, if applicable
      service_broker:
        type: object
        description: The service broker that this event pertains to
        properties:
          guid:
            type: [string, "null"]
            description: Unique identifier of the service broker that this event pertains to, if applicable
          name:
            type: [string, "null"]
            description: Name of the service broker that this event pertains to, if applicable
      links:
        type: object
        description: Links to related resources
        properties:
          self:
            $ref: './Link.yaml'
            description: The URL to get this service usage event
description: |-
  Service usage events are a record of changes in the usage of services. For example, service usage events are recorded when a service instance is created, updated, and deleted. They may contain information about the service instance in question and the associated space, service broker, and service offering.

  Usage events are typically used by billing and chargeback applications.
