type: object
description: Service plan visibility is used to manage whether a role has access to a given service plan and its service offering.
properties:
  type:
    type: string
    enum:
      - public
      - admin
      - organization
      - space
    description: Denotes the visibility of the plan; can be `public`, `admin`, `organization`, `space`, see [_list of visibility types_](#list-of-visibility-types)
  space:
    type: object
    description: The space whose members can access the plan; present if `type` is `space`
    properties:
      guid:
        type: string
        format: uuid
        description: Unique identifier for the space whose members can access the plan; present if `type` is `space`
      name:
        type: string
        description: Name of the space whose members can access the plan; present if `type` is `space`
  organizations:
    type: array
    description: List of organizations whose members can access the plan; present if `type` is `organization`
    items:
      type: object
      description: The organization visibility object
      properties:
        guid:
          type: string
          format: uuid
          description: Unique identifier for the organization where the plan is available
        name:
          type: string
          description: Name of the organization where the plan is available
required:
  - type
