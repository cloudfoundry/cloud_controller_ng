type: object
properties:
  relationships:
    type: object
    properties:
      route:
        $ref: './RelationshipToOne.yaml'
        description: The route to bind
      service_instance:
        $ref: './RelationshipToOne.yaml'
        description: The service instance to bind
    required:
      - route
      - service_instance
    description: Relationships for the service route binding
  parameters:
    type: object
    additionalProperties: true
    description: A JSON object that is passed to the service broker; only valid for managed service instances
  metadata:
    $ref: './Metadata.yaml'
    description: Labels and annotations applied to the service route binding; only valid for managed service instances
required:
  - relationships
description: A request to create a service route binding
