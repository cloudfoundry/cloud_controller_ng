type: object
allOf:
  - $ref: './BaseSchema.yaml'
  - properties:
      type:
        type: string
        enum:
          - app
        description: Either `app` or `key`
      name:
        type: [string, "null"]
        description: Name of the binding. `null` when it's not defined.
      last_operation:
        $ref: './ServiceCredentialBindingLastOperation.yaml'
        description: The last operation of this binding
      relationships:
        type: object
        properties:
          app:
            $ref: './RelationshipToOne.yaml'
            description: The app using this binding; omitted for `key` bindings
          service_instance:
            $ref: './RelationshipToOne.yaml'
            description: The service instance that this binding is originated from
        description: Relationships for the service credential binding
      links:
        type: object
        properties:
          self:
            $ref: './Link.yaml'
            description: Link to this service credential binding
          details:
            $ref: './Link.yaml'
            description: Link to the details of this service credential binding
          app:
            $ref: './Link.yaml'
            description: Link to the app using this binding
          service_instance:
            $ref: './Link.yaml'
            description: Link to the service instance that this binding is originated from
          parameters:
            $ref: './Link.yaml'
            description: Link to the parameters that this binding was created with; only present for bindings to managed service instances
        description: Links to related resources
      metadata:
        $ref: './Metadata.yaml'
        description: Labels and annotations applied to the service credential binding
      included:
        $ref: './IncludedResources.yaml'
        description: Additional related resources included in the response when using the `include` parameter
    required:
      - type
      - relationships
      - links
description: |-
  A service credential binding of type `app`; a binding between a [service instance](#service-instances) and an
  [application](#apps). Not all services support this binding, as some services deliver value to users directly
  without integration with an application.
