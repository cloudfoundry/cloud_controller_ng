type: object
properties:
  read_basic_data:
    type: boolean
    description: Whether the current user can read the app's basic data; true if the user can see the app
  read_sensitive_data:
    type: boolean
    description: Whether the current user can read the app's sensitive data; only admin, read-only admins, and space developers can read sensitive data
required:
  - read_basic_data
  - read_sensitive_data
description: The current user's permissions for the given app
