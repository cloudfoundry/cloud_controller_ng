type: object
allOf:
  - $ref: './BaseSchema.yaml'
  - properties:
      name:
        type: string
        description: Name of the security group
      rules:
        type: array
        items:
          $ref: './SecurityGroupRule.yaml'
        description: Rules that will be applied by this security group
      globally_enabled:
        type: object
        properties:
          running:
            type: boolean
            description: Specifies whether the group should be applied globally to all running applications
          staging:
            type: boolean
            description: Specifies whether the group should be applied globally to all staging applications
        description: Object that controls if the group is applied globally to the lifecycle of all applications
      relationships:
        type: object
        properties:
          running_spaces:
            $ref: './RelationshipToMany.yaml'
            description: A relationship to the spaces where the security_group is applied to applications during runtime
          staging_spaces:
            $ref: './RelationshipToMany.yaml'
            description: A relationship to the spaces where the security_group is applied to applications during staging
        description: Relationships for the security group
      links:
        type: object
        properties:
          self:
            $ref: './Link.yaml'
            description: The URL of this security group
        description: Links to related resources
    required:
    - name
    - globally_enabled
    - rules
    - relationships
    - links
description: |-
  A collection of egress traffic rules that can be applied to the staging or running state of applications.
