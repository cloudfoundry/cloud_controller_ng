type: object
description: |-
  Service offerings represent the services offered by service brokers.
  A service broker will have one or more service offerings.
  A service offering will have one or more service plans.
  Service offerings and service plans are created and updated when a service broker is registered or updated.
allOf:
  - $ref: './BaseSchema.yaml'
  - properties:
      name:
        type: string
        description: Name of the service offering
      description:
        type: string
        description: Description of the service offering
      available:
        type: boolean
        description: Whether or not the service offering is available
      tags:
        type: array
        items:
          type: string
        description: Descriptive tags for the service offering
      requires:
        type: array
        items:
          type: string
          enum:
            - syslog_drain
            - route_forwarding
            - volume_mount
        description: A list of permissions that the user would have to give the service, if they provision it; the only permissions currently supported are `syslog_drain`, `route_forwarding` and `volume_mount`
      shareable:
        type: boolean
        description: Whether or not service Instances of this service offering can be shared across organizations and spaces
      documentation_url:
        type: [string, "null"]
        description: Url that points to a documentation page for the service offering, if provided by the service broker as part of the metadata field
      broker_catalog:
        type: object
        description: This object contains information obtained from the service broker Catalog
        properties:
          id:
            type: string
            description: The identifier that the service broker provided for this service offering
          metadata:
            type: object
            additionalProperties: true
            description: Additional information provided by the service broker as specified by [OSBAPI](https://github.com/openservicebrokerapi/servicebroker/blob/master/profile.md#service-metadata-fields)
          features:
            type: object
            description: Features supported by this service offering
            properties:
              plan_updateable:
                type: boolean
                description: Whether the service offering supports upgrade/downgrade for service plans by default; service plans can override this field
              bindable:
                type: boolean
                description: Specifies whether service Instances of the service can be bound to applications
              instances_retrievable:
                type: boolean
                description: Specifies whether the Fetching a service instance endpoint is supported for all service plans
              bindings_retrievable:
                type: boolean
                description: Specifies whether the Fetching a service binding endpoint is supported for all service plans
              allow_context_updates:
                type: boolean
                description: Specifies whether service instance updates relating only to context are propagated to the service broker
      relationships:
        type: object
        description: Relationships for the service offering
        properties:
          service_broker:
            $ref: './RelationshipToOne.yaml'
            description: The service broker that provides this service offering
      metadata:
        $ref: './Metadata.yaml'
        description: Labels and annotations applied to the service offering
      links:
        type: object
        description: Links to related resources
        properties:
          self:
            $ref: './Link.yaml'
            description: The URL of this service offering
          service_plans:
            $ref: './Link.yaml'
            description: The URL to list the service plans of this service offering
          service_broker:
            $ref: './Link.yaml'
            description: The URL of the service broker that provides this service offering
    required:
    - name
    - description
    - available
    - broker_catalog
    - relationships
    - links
