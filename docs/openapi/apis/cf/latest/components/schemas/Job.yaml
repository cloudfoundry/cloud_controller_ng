type: object
allOf:
  - $ref: './BaseSchema.yaml'
  - properties:
      operation:
        type: string
        description: Current desired operation of the job on a model
      state:
        type: string
        description: |-
          State of the job; valid values are `PROCESSING`, `POLLING`, `COMPLETE`, or `FAILED`

          > **Note:** `POLLING` happens during asynchronous services operations that require polling the last operation from the service broker.
        enum:
          - PROCESSING
          - POLLING
          - COMPLETE
          - FAILED
      errors:
        type: array
        description: Array of errors that occurred while processing the job
        items:
          $ref: './Error.yaml'
      warnings:
        type: array
        description: Array of warnings that occurred while processing the job
        items:
          $ref: './Warning.yaml'
      links:
        type: object
        additionalProperties: true
        description: Links to related resources
        properties:
          self:
            $ref: './Link.yaml'
            description: The URL to get this job
          manifest:
            $ref: './Link.yaml'
            description: The URL to get the manifest for this job
          service_brokers:
            $ref: './Link.yaml'
            description: The URL to get the service broker for this job
          service_credential_binding:
            $ref: './Link.yaml'
            description: The URL to get the service credential binding for this job
          service_instances:
            $ref: './Link.yaml'
            description: The URL to get the service instance for this job
          service_route_bindings:
            $ref: './Link.yaml'
            description: The URL to get the service route binding for this job
description: 'Jobs are created by the platform when performing certain asynchronous actions. Asynchronous jobs are commonly used for long-running tasks such as uploading large files, staging applications, or deleting resources.'
