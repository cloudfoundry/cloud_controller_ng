type: object
properties:
  guid:
    type: string
    description: Unique identifier for the user, matching either a UAA user id or client id. A client id may not be a uuid.
  created_at:
    type: string
    format: date-time
    description: The time with zone when the object was created
  updated_at:
    type: string
    format: date-time
    description: The time with zone when the object was last updated
  username:
    type: [string, "null"]
    description: The name registered in UAA; will be `null` for UAA clients and non-UAA users
  presentation_name:
    type: string
    description: The name displayed for the user; for UAA users, this is the same as the username. For UAA clients, this is the UAA client ID
  origin:
    type: [string, "null"]
    description: The identity provider for the UAA user; will be `null` for UAA clients
  metadata:
    $ref: './Metadata.yaml'
    description: Labels applied to and annotations added to the user
  links:
    type: object
    description: Links to related resources
    properties:
      self:
        $ref: './Link.yaml'
        description: The URL to get this user
description: |
  The user resource is used to manage access to organizations, spaces, and other resources within Cloud Foundry.
  Cloud Controller users "shadow" a corresponding user or client in UAA; the user's guid should match either a UAA user id or a UAA client id.
