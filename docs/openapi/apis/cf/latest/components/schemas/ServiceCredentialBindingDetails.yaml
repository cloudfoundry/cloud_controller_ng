type: object
additionalProperties: true
description: |-
  The details of a service credential binding; it contains the connection details of the service instance that are made
  available to an app or a developer.

  The object is returned as provided by the service broker and may contain:
  - `credentials` (object): the service broker provided credentials that an app or a developer uses to connect to the service instance
  - `syslog_drain_url` (string): URL to which logs for bound applications will be streamed; only present when the service broker returned one
  - `volume_mounts` (array): configuration for mounting volumes when the app is started; only present when the service broker returned any
