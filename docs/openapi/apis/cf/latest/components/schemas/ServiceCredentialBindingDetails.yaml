type: object
properties:
  credentials:
    type: object
    additionalProperties: true
    description: The service broker provided credentials that an app or a developer uses to connect to the service instance
  syslog_drain_url:
    type: [string, "null"]
    format: uri
    description: URL to which logs for bound applications will be streamed; only present when the service broker returned one
  volume_mounts:
    type: array
    items:
      type: [string, object]
    description: An array of configuration for mounting volumes when the app is started; only present when the service broker returned any
description: |-
  The details of a service credential binding; it contains the connection details of the service instance that are made
  available to an app or a developer.
