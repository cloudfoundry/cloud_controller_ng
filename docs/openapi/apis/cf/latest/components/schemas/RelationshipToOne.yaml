type: object
properties:
  data:
    anyOf:
      - $ref: './Relationship.yaml'
      - type: "null"
    description: The related resource, or `null` when the relationship is not set
  links:
    type: object
    properties:
      self:
        $ref: './Link.yaml'
      related:
        $ref: './Link.yaml'
description: |
  Some relationships relate a resource to exactly one other resource. For example an app can belong to only one space.
