type: object
properties:
  data:
    type: [object, "null"]
    properties:
      guid:
        type: string
        format: uuid
        description: The GUID of the resource
  links:
    type: object
    properties:
      self:
        $ref: './Link.yaml'
      related:
        $ref: './Link.yaml'
description: |
  Some relationships relate a resource to exactly one other resource. For example an app can belong to only one space.
