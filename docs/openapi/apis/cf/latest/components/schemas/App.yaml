type: object
allOf:
  - $ref: './BaseSchema.yaml'
  - properties:
      guid:
        type: string
        format: uuid
        description: Unique identifier for the app
      created_at:
        type: string
        format: date-time
        description: The time with zone when the object was created
      updated_at:
        type: string
        format: date-time
        description: The time with zone when the object was last updated
      name:
        type: string
        description: Name of the app
      state:
        type: string
        description: Current desired state of the app; valid values are `STOPPED` or `STARTED`
        enum:
          - STOPPED
          - STARTED
      lifecycle:
        $ref: './Lifecycle.yaml'
        description: Provides the default lifecycle object for the application. This lifecycle will be used when staging and running the application. The staging lifecycle can be overridden on [builds](#builds)
      relationships:
        type: object
        description: Relationships to other resources
        properties:
          space:
            $ref: './RelationshipToOne.yaml'
            description: The space the app is contained in
          current_droplet:
            $ref: './RelationshipToOne.yaml'
            description: The current droplet used by the application
      metadata:
        $ref: './Metadata.yaml'
        description: |-
          `labels`: Labels applied to the app

          `annotations`: Annotations added to the app
      links:
        type: object
        description: Links to related resources
        properties:
          self:
            $ref: './Link.yaml'
            description: The URL to get this app
          space:
            $ref: './Link.yaml'
            description: The URL to get the space for this app
          processes:
            $ref: './Link.yaml'
            description: The URL to get the processes for this app
          packages:
            $ref: './Link.yaml'
            description: The URL to get the packages for this app
          environment_variables:
            $ref: './Link.yaml'
            description: The URL to get the environment variables for this app
          current_droplet:
            $ref: './Link.yaml'
            description: The URL to get the current droplet for this app
          droplets:
            $ref: './Link.yaml'
            description: The URL to get the droplets for this app
          tasks:
            $ref: './Link.yaml'
            description: The URL to get the tasks for this app
          start:
            $ref: './Link.yaml'
            description: The URL to start the app
          stop:
            $ref: './Link.yaml'
            description: The URL to stop the app
          revisions:
            $ref: './Link.yaml'
            description: The URL to get the revisions for this app
          deployed_revisions:
            $ref: './Link.yaml'
            description: The URL to get the deployed revisions for this app
          features:
            $ref: './Link.yaml'
            description: The URL to get the features for this app
      included:
        $ref: './IncludedResources.yaml'
        description: Additional related resources included in the response when using the include parameter
description: >
  Apps are top-level objects that link together and contain configuration information for your packages, droplets, processes, tasks, and more.
