type: object
properties:
  name:
    type: string
    description: Human-readable name for the sidecar
  command:
    type: string
    description: The command used to start the sidecar
  process_types:
    type: array
    items:
      type: string
    description: A list of process types the sidecar applies to
  memory_in_mb:
    type: [integer, "null"]
    description: Reserved memory for sidecar
description: A snapshot of a sidecar used by processes running the revision
