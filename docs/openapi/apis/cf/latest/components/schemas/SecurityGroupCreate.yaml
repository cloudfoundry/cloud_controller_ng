type: object
properties:
  name:
    type: string
    maxLength: 250
    description: Name of the security group; must be unique (case-sensitive)
  globally_enabled:
    type: object
    properties:
      running:
        type: boolean
        description: Specifies whether the group should be applied globally to all running applications
      staging:
        type: boolean
        description: Specifies whether the group should be applied globally to all staging applications
    description: Object that controls if the group is applied globally to the lifecycle of all applications
  rules:
    type: array
    items:
      $ref: './SecurityGroupRule.yaml'
    description: Rules that will be applied by this security group
  relationships:
    type: object
    properties:
      staging_spaces:
        $ref: './RelationshipToMany.yaml'
        description: A relationship to the spaces where the security group is applied to applications during staging
      running_spaces:
        $ref: './RelationshipToMany.yaml'
        description: A relationship to the spaces where the security group is applied to applications during runtime
    description: Relationships to the spaces the security group is applied to
required:
  - name
