type: object
properties:
  labels:
    type: object
    description: Broker-specified key-value pairs specifying attributes of Service Instances that do not directly imply behavior changes
  attributes:
    type: object
    description: Broker-specific key-value pairs generated by the Broker that MAY imply behavior changes by the Platform
description: |-
  The broker provided metadata object for service instances.

  Metadata provided by the service broker about this service instance; only shown when type is `managed`.
