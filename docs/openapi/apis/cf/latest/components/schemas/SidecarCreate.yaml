type: object
properties:
  name:
    type: string
    description: Human-readable name for the sidecar; required
  command:
    type: string
    description: The command used to start the sidecar; required
  process_types:
    type: array
    items:
      type: string
    description: A list of process types the sidecar applies to; required
  memory_in_mb:
    type: [integer, "null"]
    description: Reserved memory for sidecar
description: |-
  Request schema for creating a sidecar associated with an app.
