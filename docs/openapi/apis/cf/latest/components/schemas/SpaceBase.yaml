type: object
allOf:
  - $ref: './BaseSchema.yaml'
  - properties:
      name:
        type: string
        description: Name of the space
      relationships:
        type: object
        properties:
          organization:
            $ref: './RelationshipToOne.yaml'
          quota:
            $ref: './RelationshipToOne.yaml'
        description: Relationships for the space
      links:
        type: object
        properties:
          self:
            $ref: './Link.yaml'
          organization:
            $ref: './Link.yaml'
          features:
            $ref: './Link.yaml'
          apply_manifest:
            $ref: './Link.yaml'
      metadata:
        $ref: './Metadata.yaml'
    required:
    - name
    - relationships
    - links
description: >
  The Space resource without the `included` block. Referenced wherever a
  Space is nested inside another response, which never carries its own
  `included` key. Keeping the nested form separate is what stops
  Space and IncludedResources forming a circular reference.
