type: object
properties:
  app:
    type: object
    properties:
      guid:
        type: string
        description: Unique identifier (a UUID) for the app to route traffic to; required
      process:
        type: object
        properties:
          type:
            type: string
            description: Type of the process belonging to the app to route traffic to; defaults to `web`
        description: The process of the app to route traffic to
    description: The app to route traffic to; required
  port:
    type: integer
    description: Port on the destination process to route traffic to; must be between 1024 and 65535
  weight:
    type:
      - integer
      - 'null'
    deprecated: true
    description: 'Percentage of traffic which will be routed to this destination. **DEPRECATED:** this feature was only available via the experimental Service Mesh routing plane. It is no longer supported; must be between 1 and 100'
  protocol:
    type:
      - string
      - 'null'
    description: Protocol to use for this destination. Valid protocols are `http1` or `http2` if route protocol is `http`, `tcp` if route protocol is `tcp`. A `null` value will set it either `http1` or `tcp` based on the route protocol; this feature is only available if you turn it on in routing release
description: A destination to add to a route. Destinations without `process.type` specified will get process type `web` by default.
