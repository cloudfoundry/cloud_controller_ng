type: object
allOf:
  - $ref: './BaseSchema.yaml'
  - properties:
      guid:
        type: string
        format: uuid
        description: Unique identifier for the sidecar
      name:
        type: string
        description: Human-readable name for the sidecar
      command:
        type: string
        description: The command used to start the sidecar
      process_types:
        type: array
        items:
          type: string
        description: A list of process types the sidecar applies to
      memory_in_mb:
        type: [integer, "null"]
        description: Reserved memory for sidecar
      origin:
        type: string
        description: Specifies whether the sidecar was created by the user or via the buildpack
        enum:
          - user
          - buildpack
      relationships:
        type: object
        description: Relationships to other resources
        properties:
          app:
            $ref: './RelationshipToOne.yaml'
            description: The app the sidecar is associated with
      created_at:
        type: string
        format: date-time
        description: The time with zone when the object was created
      updated_at:
        type: string
        format: date-time
        description: The time with zone when the object was last updated
    required:
      - name
      - command
      - process_types
      - relationships
description: |-
  Sidecars are additional operating system processes that are run in the same container as a process.
