type: object
allOf:
  - $ref: './BaseSchema.yaml'
  - properties:
      protocol:
        type: string
      host:
        type: string
      path:
        type: string
      port:
        type: [integer, 'null']
      url:
        type: string
        description: Fully qualified path or address where the route directs traffic
      relationships:
        $ref: './Relationships.yaml'
      metadata:
        $ref: './Metadata.yaml'
      links:
        type: object
        properties:
          self:
            $ref: './Link.yaml'
            description: The URL to get this route
          space:
            $ref: './Link.yaml'
            description: The URL to get the space for this route
          domain:
            $ref: './Link.yaml'
            description: The URL to get the domain for this route
          destinations:
            $ref: './Link.yaml'
            description: The URL to get the destinations for this route
description: >
  The Route resource without the `included` block. Referenced wherever a
  Route is nested inside another response, which never carries its own
  `included` key. Keeping the nested form separate is what stops
  Route and IncludedResources forming a circular reference.
