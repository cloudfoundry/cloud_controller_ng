  post:
    summary: Create a service credential binding
    description: |-
      This endpoint creates a new service credential binding. Service credential bindings can be of type `app` or `key`; `key` is only
      valid for managed service instances.

      If failures occur when creating a service credential binding for a managed service instances, the API might execute orphan mitigation steps
      accordingly to cases outlined in the [OSBAPI specification](https://github.com/openservicebrokerapi/servicebroker/blob/master/spec.md#orphan-mitigation)

      **Permitted roles:** Admin, Space Developer, Space Supporter *(Only allowed to create bindings of type `app`.)*
    operationId: createServiceCredentialBinding
    tags:
      - Service Credential Bindings
    requestBody:
      $ref: ../components/requestBodies/ServiceCredentialBindingCreateRequestBody.yaml
    responses:
      '201':
        description: User-provided service instance credential binding created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/AppCredentialBinding.yaml
            examples:
              app_credential_binding:
                summary: App credential binding
                value:
                  guid: dde5ad2a-d8f4-44dc-a56f-0452d744f1c3
                  created_at: '2015-11-13T17:02:56Z'
                  updated_at: '2016-06-08T16:41:26Z'
                  name: some-name
                  type: app
                  last_operation:
                    type: create
                    state: succeeded
                    created_at: '2015-11-13T17:02:56Z'
                    updated_at: '2016-06-08T16:41:26Z'
                  metadata:
                    annotations:
                      foo: bar
                    labels:
                      baz: qux
                  relationships:
                    app:
                      data:
                        guid: 74f7c078-0934-470f-9883-4fdd555b8f13
                    service_instance:
                      data:
                        guid: 8bfe4c1b-9e18-45b1-83be-124163f31f9e
                  links:
                    self:
                      href: https://api.example.org/v3/service_credential_bindings/dde5ad2a-d8f4-44dc-a56f-0452d744f1c3
                    details:
                      href: https://api.example.org/v3/service_credential_bindings/dde5ad2a-d8f4-44dc-a56f-0452d744f1c3/details
                    parameters:
                      href: https://api.example.org/v3/service_credential_bindings/dde5ad2a-d8f4-44dc-a56f-0452d744f1c3/parameters
                    service_instance:
                      href: https://api.example.org/v3/service_instances/8bfe4c1b-9e18-45b1-83be-124163f31f9e
                    app:
                      href: https://api.example.org/v3/apps/74f7c078-0934-470f-9883-4fdd555b8f13
      '202':
        description: Managed service instance credential binding creation accepted; the binding is being created asynchronously
        headers:
          Location:
            description: URL of the [job](#jobs) that is creating the service credential binding
            schema:
              type: string
              format: uri
              examples:
                - https://api.example.org/v3/jobs/af5c57f6-8769-41fa-a499-2c84ed896788
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
/v3/service_credential_bindings/{guid}:
  get:
    summary: Get a service credential binding
    description: |-
      This endpoint retrieves the service credential binding by GUID.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager, Space Auditor, Space Developer, Space Manager, Space Supporter
    operationId: getServiceCredentialBinding
    tags:
      - Service Credential Bindings
    parameters:
      - $ref: ../components/parameters/Guid.yaml
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
              - app
              - service_instance
        description: 'Optionally include a list of unique related resources in the response. Valid values are: `app`, `service_instance`'
    responses:
      '200':
        description: Request succeeded
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../components/schemas/AppCredentialBinding.yaml
                - $ref: ../components/schemas/KeyCredentialBinding.yaml
              discriminator:
                propertyName: type
