/v3/service_credential_bindings:
  get:
    summary: List service credential bindings
    description: |-
      This endpoint retrieves the service credential bindings the user has access to.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager, Space Auditor, Space Developer, Space Manager, Space Supporter
    operationId: listServiceCredentialBindings
    tags:
      - Service Credential Bindings
    parameters:
      - name: names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service credential binding names to filter by (case-sensitive)
      - name: service_instance_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service instance guids to filter by
      - name: service_instance_names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service instance names to filter by (case-sensitive)
      - name: app_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of app guids to filter by
      - name: app_names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of app names to filter by (case-insensitive)
      - name: service_plan_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service plan guids to filter by
      - name: service_plan_names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service plan names to filter by (case-insensitive)
      - name: service_offering_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service offering guids to filter by
      - name: service_offering_names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service offering names to filter by (case-insensitive)
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
            - app
            - key
        description: 'Type of credential binding to filter by. Valid values are: `app` or `key`'
      - name: guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service credential binding guids to filter by
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
              - app
              - service_instance
        description: 'Optionally include a list of unique related resources in the response. Valid values are: `app`, `service_instance`'
      - $ref: ../components/parameters/LabelSelector.yaml
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
            - name
            - -name
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`, and `name`
    responses:
      '200':
        description: Request succeeded
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ServiceCredentialBindingList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 3
                    total_pages: 2
                    first:
                      href: https://api.example.org/v3/service_credential_bindings?page=1&per_page=2
                    last:
                      href: https://api.example.org/v3/service_credential_bindings?page=2&per_page=2
                    next:
                      href: https://api.example.org/v3/service_credential_bindings?page=2&per_page=2
                    previous: null
                  resources:
                    - guid: dde5ad2a-d8f4-44dc-a56f-0452d744f1c3
                      created_at: '2015-11-13T17:02:56Z'
                      updated_at: '2016-06-08T16:41:26Z'
