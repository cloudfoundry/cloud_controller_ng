/v3/service_credential_bindings/{guid}/parameters:
  get:
    summary: Get parameters for a service credential binding
    description: |-
      Queries the Service Broker for the parameters associated with this service credential binding.
      The broker catalog must have enabled the `bindings_retrievable` feature for the Service Offering.
      Check the [Service Offering object](#the-service-offering-object) for the value of this feature flag.
      This endpoint is not available for User-Provided Service Instances.

      **Permitted roles:** Admin, Admin Read-Only, Space Developer, Space Supporter
    operationId: getServiceCredentialBindingParameters
    tags:
      - Service Credential Bindings
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    responses:
      '200':
        description: Request succeeded
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The parameters that the service credential binding was created with, as returned by the service broker
            examples:
              default:
                summary: default
                value:
                  foo: bar
                  foz: baz
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
