  delete:
    summary: Delete a service credential binding
    description: |-
      This endpoint deletes a service credential binding. When deleting credential bindings originated from user provided
      service instances, the delete operation does not require interactions with service brokers, therefore the API will
      respond synchronously to the delete request.

      **Permitted roles:** Admin, Space Developer, Space Supporter *(Only allowed to delete bindings of type `app`.)*
    operationId: deleteServiceCredentialBinding
    tags:
      - Service Credential Bindings
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    responses:
      '202':
        description: Managed service instance credential binding deletion accepted; the binding is being deleted asynchronously
        headers:
          Location:
            description: URL of the [job](#jobs) that is deleting the service credential binding
            schema:
              type: string
              format: uri
              examples:
                - https://api.example.org/v3/jobs/af5c57f6-8769-41fa-a499-2c84ed896788
      '204':
        description: User-provided service instance credential binding deleted
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
