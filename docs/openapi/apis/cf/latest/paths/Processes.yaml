/v3/processes/{guid}/process_instances:
  get:
    summary: Get process instances for a process (experimental)
    description: |-
      This endpoint retrieves the instances for a process. This is a pseudo-resource that provides a lightweight view of process instance states, containing only the `index`, `state`, and `since` fields. Unlike the full [process stats](#get-stats-for-a-process) endpoint, this endpoint is designed for embedding into process resources and provides a minimal representation.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager, Space Auditor, Space Developer, Space Manager, Space Supporter
    operationId: listProcessInstances
    tags:
      - Processes
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ProcessInstanceList.yaml
            examples:
              default:
                summary: default
                value:
                  resources:
                    - index: 0
                      state: RUNNING
                      since: 123456789
                    - index: 1
                      state: STARTING
                      since: 123
                    - index: 2
                      state: DOWN
                      since: 456
                  links:
                    self:
                      href: https://api.example.org/v3/processes/6a901b7c-9417-4dc1-8189-d3234aa0ab82/process_instances
                    process:
                      href: https://api.example.org/v3/processes/6a901b7c-9417-4dc1-8189-d3234aa0ab82
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
