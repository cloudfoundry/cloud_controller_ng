/v3/app_usage_events:
  get:
    summary: List app usage events
    description: |-
      Retrieve all app usage events the user has access to.

      **Permitted roles:** All Roles
    operationId: listAppUsageEvents
    tags:
      - App Usage Events
    parameters:
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid value is `created_at`
      - name: after_guid
        in: query
        required: false
        schema:
          type: string
        description: Filters out events before and including the event with the given guid
      - name: guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of usage event guids to filter by
      - $ref: ../components/parameters/CreatedAts.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/AppUsageEventList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 2
                    total_pages: 2
                    first:
                      href: https://api.example.org/v3/app_usage_events?page=1&per_page=1
                    last:
                      href: https://api.example.org/v3/app_usage_events?page=2&per_page=1
                    next:
                      href: https://api.example.org/v3/app_usage_events?page=2&per_page=1
                    previous: null
                  resources:
                    - guid: 123e4567-e89b-12d3-a456-426614174000
                      created_at: '2020-05-28T16:41:23Z'
                      updated_at: '2020-05-28T16:41:26Z'
                      state:
                        current: STARTED
                        previous: STOPPED
                      app:
                        guid: 123e4567-e89b-12d3-a456-426614174000
                        name: name-1982
                      process:
                        guid: 123e4567-e89b-12d3-a456-426614174000
                        type: type-1983
                      space:
                        guid: 123e4567-e89b-12d3-a456-426614174000
                        name: name-1664
                      organization:
                        guid: 123e4567-e89b-12d3-a456-426614174000
