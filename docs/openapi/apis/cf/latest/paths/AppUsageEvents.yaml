/v3/app_usage_events/{guid}:
  get:
    summary: Get an app usage event
    description: |-
      Retrieve an app usage event.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor
    operationId: getAppUsageEvent
    tags:
      - App Usage Events
    parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the app usage event
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/AppUsageEvent.yaml
            examples:
              default:
