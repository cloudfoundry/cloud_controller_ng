/v3/roles:
  get:
    summary: List roles
    description: |-
      This endpoint lists roles that the user has access to.

      **Permitted roles:** All Roles
    operationId: listRoles
    tags:
      - Roles
    parameters:
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
      - name: guids
        in: query
        description: Comma-delimited list of role guids to filter by
        schema:
          type: array
          items:
            type: string
      - name: types
        in: query
        description: Comma-delimited list of [role types](#valid-role-types) to filter by
        schema:
          type: array
          items:
            type: string
            enum:
              - organization_user
              - organization_auditor
              - organization_manager
              - organization_billing_manager
              - space_auditor
              - space_developer
              - space_manager
              - space_supporter
      - name: space_guids
        in: query
        description: Comma-delimited list of space guids to filter by
        schema:
          type: array
          items:
            type: string
      - name: organization_guids
        in: query
        description: Comma-delimited list of organization guids to filter by
        schema:
          type: array
          items:
            type: string
      - name: user_guids
        in: query
        description: Comma-delimited list of user guids to filter by
        schema:
          type: array
          items:
            type: string
      - name: include
        in: query
        description: Optionally include a list of unique related resources in the response; valid values are `user`, `space`, and `organization`
        schema:
          type: array
          items:
            type: string
            enum:
              - user
              - space
              - organization
    responses:
      '200':
        $ref: ../components/responses/RoleListResponse.yaml
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '502':
        $ref: ../components/responses/BadGateway.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
  post:
    summary: Create a role
    description: |-
      This endpoint creates a new role for a user in an organization or space.

      To create an organization role you must be an admin or organization manager in the organization associated with the role.

      To create a space role you must be an admin, an organization manager in the parent organization of the space associated with the role, or a space manager in the space associated with the role.

      For a user to be assigned a space role, the user must already have an organization role in the parent organization.

      If the associated user does not exist in Cloud Controller's database, a user resource will be created automatically. This user may correspond to a UAA user or client. See the [user resource](#users) for more details.

      If CAPI property `cc.allow_user_creation_by_org_manager` is enabled, the organization role is being created by username + origin and the user does not exist in UAA yet, the user will be created.
      The origin must be different from `uaa` in this case.

      **Permitted roles:** Admin, Org Manager *(Can create roles in managed organizations and spaces within those organizations; can also create roles for users outside of managed organizations when `set_roles_by_username` [feature_flag](#list-of-feature-flags) is enabled; this requires identifying users by username and origin)*, Space Manager *(Can create roles in managed spaces for users in their org)*
    operationId: createRole
    tags:
      - Roles
    requestBody:
      $ref: ../components/requestBodies/RoleCreate.yaml
    responses:
      '201':
        description: Role created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Role.yaml
            examples:
              by_user_guid:
                summary: by user guid
                value:
                  guid: 40557c70-d1bd-4976-a2ab-a85f5e882418
                  created_at: '2019-10-10T17:19:12Z'
                  updated_at: '2019-10-10T17:19:12Z'
                  type: organization_auditor
                  relationships:
                    user:
                      data:
                        guid: 59eadb5f-fc13-414f-84ba-77a35e239cc8
                    organization:
                      data:
                        guid: 05c5da3b-6cbc-421c-87c3-20bb3c41ab7c
                    space:
                      data: null
                  links:
                    self:
                      href: https://api.example.org/v3/roles/40557c70-d1bd-4976-a2ab-a85f5e882418
                    user:
                      href: https://api.example.org/v3/users/59eadb5f-fc13-414f-84ba-77a35e239cc8
                    organization:
                      href: https://api.example.org/v3/organizations/05c5da3b-6cbc-421c-87c3-20bb3c41ab7c
              by_username_and_origin:
                summary: by username and origin
                value:
                  guid: 40557c70-d1bd-4976-a2ab-a85f5e882418
                  created_at: '2019-10-10T17:19:12Z'
                  updated_at: '2019-10-10T17:19:12Z'
                  type: organization_auditor
                  relationships:
                    user:
                      data:
                        guid: 59eadb5f-fc13-414f-84ba-77a35e239cc8
                    organization:
                      data:
                        guid: 05c5da3b-6cbc-421c-87c3-20bb3c41ab7c
                    space:
                      data: null
                  links:
                    self:
                      href: https://api.example.org/v3/roles/40557c70-d1bd-4976-a2ab-a85f5e882418
                    user:
                      href: https://api.example.org/v3/users/59eadb5f-fc13-414f-84ba-77a35e239cc8
                    organization:
                      href: https://api.example.org/v3/organizations/05c5da3b-6cbc-421c-87c3-20bb3c41ab7c
        links:
          user:
            operationId: getUser
            parameters:
              guid: $response.body#/relationships/user/data/guid
            description: Retrieve the user for this role
          organization:
            operationId: getOrganization
            parameters:
              guid: $response.body#/relationships/organization/data/guid
            description: Retrieve the organization for this role (if organization role)
          space:
            operationId: getSpace
            parameters:
              guid: $response.body#/relationships/space/data/guid
            description: Retrieve the space for this role (if space role)
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '429':
        $ref: ../components/responses/TooManyRequests.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
/v3/roles/{guid}:
  get:
    summary: Get a role
    description: |-
      This endpoint gets an individual role resource.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager *(Can see roles in managed organizations or spaces in those organizations)*, Org Auditor *(Can only see organization roles in audited organizations)*, Org Billing Manager *(Can only see organization roles in billing-managed organizations)*, Space Auditor *(Can see roles in audited spaces or parent organizations)*, Space Developer *(Can see roles in developed spaces or parent organizations)*, Space Manager *(Can see roles in managed spaces or parent organizations)*, Space Supporter *(Can see roles in supported spaces or parent organizations)*
    operationId: getRole
    tags:
      - Roles
    parameters:
      - $ref: ../components/parameters/Guid.yaml
      - name: include
        in: query
        description: Optionally include a list of unique related resources in the response; valid values are `user`, `space`, and `organization`
        schema:
          type: array
          items:
            type: string
            enum:
              - user
              - space
              - organization
    responses:
      '200':
        description: Role retrieved
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Role.yaml
            examples:
              default:
                summary: default
                value:
                  guid: 40557c70-d1bd-4976-a2ab-a85f5e882418
                  created_at: '2019-10-10T17:19:12Z'
                  updated_at: '2019-10-10T17:19:12Z'
                  type: organization_auditor
                  relationships:
                    user:
                      data:
                        guid: 59eadb5f-fc13-414f-84ba-77a35e239cc8
                    organization:
                      data:
                        guid: 05c5da3b-6cbc-421c-87c3-20bb3c41ab7c
                    space:
                      data: null
                  links:
                    self:
                      href: https://api.example.org/v3/roles/40557c70-d1bd-4976-a2ab-a85f5e882418
                    user:
                      href: https://api.example.org/v3/users/59eadb5f-fc13-414f-84ba-77a35e239cc8
                    organization:
                      href: https://api.example.org/v3/organizations/05c5da3b-6cbc-421c-87c3-20bb3c41ab7c
        links:
          user:
            operationId: getUser
            parameters:
              guid: $response.body#/relationships/user/data/guid
            description: Retrieve the user for this role
          organization:
            operationId: getOrganization
            parameters:
              guid: $response.body#/relationships/organization/data/guid
            description: Retrieve the organization for this role (if organization role)
          space:
            operationId: getSpace
            parameters:
              guid: $response.body#/relationships/space/data/guid
            description: Retrieve the space for this role (if space role)
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
  delete:
    summary: Delete a role
    description: |-
      This endpoint deletes an individual role.

      **Permitted roles:** Admin, Org Manager *(Can delete roles in managed organizations or spaces in those organizations)*, Space Manager *(Can delete roles in managed spaces)*
    operationId: deleteRole
    tags:
      - Roles
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    responses:
      '202':
        description: Accepted
        headers:
          Location:
            description: URL of the job that is deleting the role
            schema:
              type: string
              format: uri
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
