/v3/droplets:
  get:
    summary: List droplets
    description: |-
      Retrieve all droplets the user has access to.

      **Permitted roles:** All Roles
    operationId: listDroplets
    tags:
      - Droplets
    parameters:
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at` and `updated_at`
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
      - $ref: ../components/parameters/LabelSelector.yaml
      - name: guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of droplet guids to filter by
      - name: states
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
              - AWAITING_UPLOAD
              - PROCESSING_UPLOAD
              - STAGED
              - COPYING
              - FAILED
              - EXPIRED
        description: Comma-delimited list of droplet states to filter by
      - name: app_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of app guids to filter by
      - name: current
        in: query
        required: false
        schema:
          type: boolean
        description: If true, only include the current droplet for each app
      - name: space_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space guids to filter by
      - name: organization_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization guids to filter by
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/DropletList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 2
