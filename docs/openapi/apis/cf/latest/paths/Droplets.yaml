  post:
    summary: Create or copy a droplet
    description: |-
      This endpoint is only for creating a droplet without a package. To create a droplet based on a package, see [Create a build](#create-a-build).

      **Copy a droplet:** supplying the optional `source_guid` query parameter copies the droplet identified by `source_guid` to a different app instead of creating a new droplet. The copied droplet excludes the environment variables listed on the source droplet. In copy mode the only accepted body parameter is `relationships.app`, a relationship to the destination app; `process_types` is not accepted.

      **Permitted roles:** Admin, Space Developer
    operationId: createDroplet
    tags:
      - Droplets
    parameters:
      - name: source_guid
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Source guid of the droplet to be copied. When supplied, the droplet is copied to the app given in `relationships.app` rather than created from scratch
    requestBody:
      $ref: ../components/requestBodies/DropletCreateRequestBody.yaml
    responses:
      '201':
        $ref: ../components/responses/DropletCreateResponse.yaml
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
