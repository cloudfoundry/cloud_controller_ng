/v3/sidecars/{guid}:
  get:
    summary: Get a sidecar
    description: |-
      Retrieve a sidecar.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager, Space Auditor, Space Developer, Space Manager, Space Supporter
    operationId: getSidecar
    tags:
      - Sidecars
    parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the sidecar
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Sidecar.yaml
            examples:
              default:
                summary: default
                value:
                  guid: 885735b5-aea4-4cf5-8e44-961af0e41920
                  name: auth-sidecar
                  command: bundle exec rackup
                  process_types:
                    - web
                    - worker
                  memory_in_mb: 300
                  origin: user
                  relationships:
                    app:
                      data:
                        guid: 1cb006ee-fb05-47e1-b541-c34179ddc446
                  created_at: '2017-02-01T01:33:58Z'
                  updated_at: '2017-02-01T01:33:58Z'
        links:
          app:
            operationId: getApp
            parameters:
              guid: $response.body#/relationships/app/data/guid
            description: Retrieve the app for this sidecar
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '502':
        $ref: ../components/responses/BadGateway.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
  patch:
    summary: Update a sidecar
    description: |-
      Update a sidecar.

      **Permitted roles:** Admin, Space Developer
    operationId: updateSidecar
    tags:
      - Sidecars
    parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the sidecar
    requestBody:
      $ref: ../components/requestBodies/SidecarUpdateRequestBody.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Sidecar.yaml
            examples:
              default:
                summary: default
                value:
                  guid: 885735b5-aea4-4cf5-8e44-961af0e41920
                  name: auth-sidecar
                  command: bundle exec rackup
                  process_types:
                    - web
                    - worker
                  memory_in_mb: 300
                  origin: user
                  relationships:
                    app:
                      data:
                        guid: 1cb006ee-fb05-47e1-b541-c34179ddc446
                  created_at: '2017-02-01T01:33:58Z'
                  updated_at: '2017-02-01T01:33:58Z'
        links:
          app:
            operationId: getApp
            parameters:
              guid: $response.body#/relationships/app/data/guid
            description: Retrieve the app for this sidecar
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
  delete:
    summary: Delete a sidecar
    description: |-
      Delete a sidecar.

      **Permitted roles:** Admin, Space Developer
    operationId: deleteSidecar
    tags:
      - Sidecars
    parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the sidecar
    responses:
      '204':
        description: No Content
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
/v3/apps/{guid}/sidecars:
  get:
    summary: List sidecars for app
    description: |-
      Retrieves all sidecars associated with a app.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager, Space Auditor, Space Developer, Space Manager, Space Supporter
    operationId: listAppSidecars
    tags:
      - Sidecars
    parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the app
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - "-created_at"
            - updated_at
            - "-updated_at"
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/SidecarList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 3
                    total_pages: 2
                    first:
                      href: https://api.example.org/v3/apps/c7bd571f-dc48-406e-a503-3d871d659551/sidecars?page=1&per_page=2
                    last:
                      href: https://api.example.org/v3/apps/c7bd571f-dc48-406e-a503-3d871d659551/sidecars?page=2&per_page=2
                    next:
                      href: https://api.example.org/v3/apps/c7bd571f-dc48-406e-a503-3d871d659551/sidecars?page=2&per_page=2
                    previous: null
                  resources:
                    - guid: 885735b5-aea4-4cf5-8e44-961af0e41920
                      name: auth-sidecar
                      command: bundle exec rackup
                      process_types:
                        - web
                        - worker
                      memory_in_mb: 300
                      origin: user
                      relationships:
                        app:
                          data:
                            guid: 1cb006ee-fb05-47e1-b541-c34179ddc446
                      created_at: '2017-02-01T01:33:58Z'
                      updated_at: '2017-02-01T01:33:58Z'
                    - guid: 885735b5-aea4-4cf5-8e44-961af0e41921
                      name: echo-sidecar
                      command: start-echo-server
                      process_types:
                        - web
                      memory_in_mb: 300
                      origin: user
                      relationships:
                        app:
                          data:
                            guid: 1cb006ee-fb05-47e1-b541-c34179ddc446
                      created_at: '2017-02-01T01:33:59Z'
                      updated_at: '2017-02-01T01:33:59Z'
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
  post:
    summary: Create a sidecar associated with an app
    description: |-
      Create a sidecar associated with an app.

      **Permitted roles:** Admin, Space Developer
    operationId: createSidecar
    tags:
      - Sidecars
    parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the app
    requestBody:
      $ref: ../components/requestBodies/SidecarCreate.yaml
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Sidecar.yaml
            examples:
              default:
                summary: default
                value:
                  guid: 885735b5-aea4-4cf5-8e44-961af0e41920
                  name: auth-sidecar
                  command: bundle exec rackup
                  process_types:
                    - web
                    - worker
                  memory_in_mb: 300
                  origin: user
                  relationships:
                    app:
                      data:
                        guid: 1cb006ee-fb05-47e1-b541-c34179ddc446
                  created_at: '2017-02-01T01:33:58Z'
                  updated_at: '2017-02-01T01:33:58Z'
        links:
          app:
            operationId: getApp
            parameters:
              guid: $response.body#/relationships/app/data/guid
            description: Retrieve the app for this sidecar
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
