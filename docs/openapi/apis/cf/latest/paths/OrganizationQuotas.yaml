/v3/organization_quotas/{quota_guid}/relationships/organizations:
  post:
    summary: Apply an organization quota to an organization
    description: |-
      This endpoint applies an organization quota to one or more organizations.

      Only admin users can apply an organization quota to an organization.

      **Permitted roles:** Admin
    operationId: applyOrganizationQuota
    tags:
      - Organization Quotas
    parameters:
      - name: quota_guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the organization quota
    requestBody:
      description: The organizations that the organization quota will be applied to
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Request schema for applying an organization quota to organizations
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/Relationship.yaml
                description: Organization guids that the quota will apply to
            required:
              - data
          examples:
            default:
              summary: default
              value:
                data:
                  - guid: d4c91047-7b29-4fda-b7f9-04033e5c9c9f
                  - guid: 24637893-3b77-489d-bb79-8466f0d88b52
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              description: The organizations the organization quota is applied to
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/Relationship.yaml
                  description: Organization guids that the quota applies to
                links:
                  type: object
                  description: Links to related resources
                  properties:
                    self:
                      $ref: ../components/schemas/Link.yaml
                      description: The URL of this organization quota to organizations relationship
            examples:
              default:
                summary: default
                value:
                  data:
                    - guid: d4c91047-7b29-4fda-b7f9-04033e5c9c9f
                    - guid: 24637893-3b77-489d-bb79-8466f0d88b52
                    - guid: 9b370018-c38e-44c9-86d6-155c76801104
                  links:
                    self:
                      href: https://api.example.org/v3/organization_quotas/b7887f5c-34bb-40c5-9778-577572e4fb2d/relationships/organizations
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
