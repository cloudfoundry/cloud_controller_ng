/v3/organization_quotas:
  get:
    summary: List organization quotas
    description: |-
      This endpoint lists all organization quota resources.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager *(response will only include guids of managed organizations)*, Org Auditor *(response will only include guids of audited organizations)*, Org Billing Manager *(response will only include guids of billing-managed organizations)*, Space Auditor *(response will only include guids of parent organizations)*, Space Developer *(response will only include guids of parent organizations)*, Space Manager *(response will only include guids of parent organizations)*, Space Supporter *(response will only include guids of parent organizations)*
    operationId: listOrganizationQuotas
    tags:
      - Organization Quotas
    parameters:
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        description: Value to sort by; defaults to ascending. Prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`
      - name: guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization quota guids to filter by
      - name: names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization quota names to filter by (case-insensitive)
      - name: organization_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization guids to filter by
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/OrganizationQuotaList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 2
                    total_pages: 1
                    first:
                      href: https://api.example.org/v3/organization_quotas?page=1&per_page=50
                    last:
                      href: https://api.example.org/v3/organization_quotas?page=1&per_page=50
