      This endpoint gets an individual organization quota resource.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager *(response will only include guids of managed organizations)*, Org Auditor *(response will only include guids of audited organizations)*, Org Billing Manager *(response will only include guids of billing-managed organizations)*, Space Auditor *(response will only include guids of parent organizations)*, Space Developer *(response will only include guids of parent organizations)*, Space Manager *(response will only include guids of parent organizations)*, Space Supporter *(response will only include guids of parent organizations)*
