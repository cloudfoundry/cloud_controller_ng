/v3/security_groups/{guid}/relationships/running_spaces:
  post:
    summary: Bind a running security group to spaces
    description: |-
      This endpoint binds one or more spaces to a security group with the running lifecycle.

      Running app containers within these spaces will inherit the rules specified by this security group.

      Apps within these spaces must be restarted for these changes to take effect.

      Unless a security group is globally-enabled, an admin must add it to a space for it to be visible for the org and space managers. Once it's visible, org and space managers can add it to additional spaces.

      **Permitted roles:** Admin, Space Manager *(can bind visible security groups to their spaces; visible groups are globally–enabled security groups or groups associated with a space they can see)*, Org Manager *(can bind visible security groups to their organizations' spaces; visible groups are globally–enabled security groups or groups associated with a space they can see)*
    operationId: bindRunningSecurityGroup
    tags:
      - Security Groups
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/Relationship.yaml
                description: Space guids that will be bound to the security group
            required:
              - data
          examples:
            default:
              summary: default
              value:
                data:
                  - guid: 885735b5-aea4-4cf5-8e44-961af0e41920
                  - guid: 2f35885d-0c9d-4423-83ad-fd05066f8576
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RelationshipToMany.yaml
            examples:
              default:
                summary: default
                value:
                  data:
                    - guid: 885735b5-aea4-4cf5-8e44-961af0e41920
                    - guid: 2f35885d-0c9d-4423-83ad-fd05066f8576
                    - guid: 5a84d315-9513-4d74-95e5-f6a5501eeef7
                  links:
                    self:
                      href: https://api.example.org/v3/security_groups/b85a788e-671f-4549-814d-e34cdb2f539a/relationships/running_spaces
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
/v3/security_groups/{guid}/relationships/running_spaces/{space_guid}:
  delete:
    summary: Unbind a running security group from a space
    description: |-
      This endpoint removes a space from a security group with the running lifecycle.

      Apps within this space must be restarted for these changes to take effect.

      **Permitted roles:** Admin, Space Manager *(can unbind visible security groups from their spaces; visible groups are globally–enabled security groups or groups associated with a space they can see)*, Org Manager *(can unbind visible security groups from their organizations' spaces; visible groups are globally–enabled security groups or groups associated with a space they can see)*
    operationId: unbindRunningSecurityGroup
    tags:
      - Security Groups
    parameters:
      - $ref: ../components/parameters/Guid.yaml
      - $ref: ../components/parameters/SpaceGuid.yaml
    responses:
      '204':
        description: No Content
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
