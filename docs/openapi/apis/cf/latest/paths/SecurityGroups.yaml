                      ports: 80,443,8080
                      description: Only valid if cc.security_groups.enable_comma_delimited_destinations is true
                  relationships:
                    staging_spaces:
                      data:
                        - guid: 885735b5-aea4-4cf5-8e44-961af0e41920
