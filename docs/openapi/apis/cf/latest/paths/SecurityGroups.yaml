/v3/security_groups:
  get:
    summary: List security groups
    description: |-
      Retrieve all security groups the user has access to.

      **Permitted roles:** Admin *(can see all security groups)*, Admin Read-Only *(can see all security groups)*, Global Auditor *(can see all security groups)*, Org Auditor *(can see globally–enabled security groups)*, Org Billing Manager *(can see globally–enabled security groups)*, Org Manager *(can see globally–enabled security groups or groups associated with a space they can see)*, Space Auditor *(can see globally–enabled security groups or groups associated with a space they can see)*, Space Developer *(can see globally–enabled security groups or groups associated with a space they can see)*, Space Manager *(can see globally–enabled security groups or groups associated with a space they can see)*, Space Supporter *(can see globally–enabled security groups or groups associated with a space they can see)*
    operationId: listSecurityGroups
    tags:
      - Security Groups
    parameters:
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
      - name: guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of security group guids to filter by
      - name: names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of security group names to filter by (case-sensitive)
      - name: globally_enabled_running
        in: query
        required: false
        schema:
          type: boolean
        description: If true, only include the security groups that are enabled for running
      - name: globally_enabled_staging
        in: query
        required: false
        schema:
          type: boolean
        description: If true, only include the security groups that are enabled for staging
      - name: running_space_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space guids to filter by
      - name: staging_space_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space guids to filter by
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/SecurityGroupList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 1
                    total_pages: 1
                    first:
                      href: https://api.example.org/v3/security_groups?page=1&per_page=50
                    last:
                      href: https://api.example.org/v3/security_groups?page=1&per_page=50
                    next: null
                    previous: null
                  resources:
                    - guid: b85a788e-671f-4549-814d-e34cdb2f539a
                      created_at: '2020-02-20T17:42:08Z'
                      updated_at: '2020-02-20T17:42:08Z'
                      name: my-group0
                      globally_enabled:
                        running: true
                        staging: false
                      rules:
                        - protocol: tcp
                          destination: 10.10.10.0/24
                          ports: 443,80,8080
                        - protocol: icmp
                          destination: 10.10.10.0/24
                          type: 8
                          code: 0
                          description: Allow ping requests to private services
                      relationships:
                        staging_spaces:
                          data:
                            - guid: 885735b5-aea4-4cf5-8e44-961af0e41920
                            - guid: 2f35885d-0c9d-4423-83ad-fd05066f8576
                        running_spaces:
                          data: []
                      links:
                        self:
                          href: https://api.example.org/v3/security_groups/b85a788e-671f-4549-814d-e34cdb2f539a
                    - guid: a89a788e-671f-4549-814d-e34c1b2f533a
                      created_at: '2020-02-20T17:42:08Z'
                      updated_at: '2020-02-20T17:42:08Z'
                      name: my-group1
                      globally_enabled:
                        running: true
                        staging: true
                      rules: []
                      relationships:
                        staging_spaces:
                          data: []
                        running_spaces:
                          data: []
                      links:
                        self:
                          href: https://api.example.org/v3/security_groups/a89a788e-671f-4549-814d-e34c1b2f533a
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '502':
        $ref: ../components/responses/BadGateway.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
