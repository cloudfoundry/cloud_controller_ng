      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SecurityGroupCreate.yaml
          examples:
            default:
              summary: default
              value:
                name: my-group0
                rules:
                  - protocol: tcp
                    destination: 10.10.10.0/24
                    ports: 443,80,8080
                  - protocol: icmp
                    destination: 10.10.10.0/24
                    type: 8
                    code: 0
                    description: Allow ping requests to private services
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/SecurityGroup.yaml
            examples:
              default:
                summary: default
                value:
                  guid: b85a788e-671f-4549-814d-e34cdb2f539a
                  created_at: '2020-02-20T17:42:08Z'
                  updated_at: '2020-02-20T17:42:08Z'
                  name: my-group0
                  globally_enabled:
