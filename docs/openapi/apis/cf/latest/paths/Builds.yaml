/v3/builds:
  get:
    summary: List builds
    description: |-
      Retrieve all builds the user has access to.

      **Permitted roles:** All Roles
    operationId: listBuilds
    tags:
      - Builds
    parameters:
      - name: states
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
              - STAGING
              - STAGED
              - FAILED
        description: Comma-delimited list of build states to filter by
      - name: app_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of app guids to filter by
      - name: package_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of package guids to filter by
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        description: Value to sort by; defaults to ascending. Prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`
      - $ref: ../components/parameters/LabelSelector.yaml
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/BuildList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 1
                    total_pages: 1
                    first:
                      href: https://api.example.org/v3/builds?states=STAGING&page=1&per_page=2
                    last:
                      href: https://api.example.org/v3/builds?states=STAGING&page=1&per_page=2
                    next: null
                    previous: null
                  resources:
                    - guid: 585bc3c1-3743-497d-88b0-403ad6b56d16
