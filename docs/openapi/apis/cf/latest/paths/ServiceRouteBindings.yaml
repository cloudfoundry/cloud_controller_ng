  delete:
    summary: Delete a service route binding
    description: |-
      This endpoint deletes a service route binding. When deleting route bindings originating from user provided
      service instances, the delete operation does not require interactions with service brokers, therefore the API will
      respond synchronously to the delete request. Consequently, deleting route bindings from managed service instances
      responds with a job which can be used to track the progress of the delete operation.

      **Permitted roles:** Admin, Space Developer, Space Supporter
    operationId: deleteServiceRouteBinding
    tags:
      - Service Route Bindings
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    responses:
      '202':
        description: Managed service instance route binding deletion accepted; the binding is being deleted asynchronously
        headers:
          Location:
            description: URL of the [job](#jobs) that is deleting the service route binding
            schema:
              type: string
              format: uri
              examples:
                - https://api.example.org/v3/jobs/af5c57f6-8769-41fa-a499-2c84ed896788
      '204':
        description: User-provided service instance route binding deleted
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
/v3/service_route_bindings/{guid}/parameters:
  get:
    summary: Get parameters for a route binding
    description: |-
      Queries the Service Broker for the parameters associated with this service route binding.
      The broker catalog must have enabled the `bindings_retrievable` feature for the Service Offering.
      Check the [Service Offering object](#the-service-offering-object) for the value of this feature flag.
      This endpoint is not available for User-Provided Service Instances.

      **Permitted roles:** Admin, Admin Read-Only, Space Developer
    operationId: getServiceRouteBindingParameters
    tags:
      - Service Route Bindings
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    responses:
      '200':
        description: Request succeeded
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The parameters that the service route binding was created with, as returned by the service broker
            examples:
              default:
                summary: default
                value:
                  foo: bar
                  foz: baz
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
