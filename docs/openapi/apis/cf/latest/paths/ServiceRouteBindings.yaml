/v3/service_route_bindings:
  get:
    summary: List service route bindings
    description: |-
      This endpoint retrieves the service route bindings the user has access to.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager, Space Auditor, Space Developer, Space Manager, Space Supporter
    operationId: listServiceRouteBindings
    tags:
      - Service Route Bindings
    parameters:
      - name: route_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of route guids to filter by
      - name: service_instance_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service instance guids to filter by
      - name: service_instance_names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service instance names to filter by (case-sensitive)
      - $ref: ../components/parameters/LabelSelector.yaml
      - name: guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service route binding guids to filter by
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
              - route
              - service_instance
        description: 'Optionally include a list of unique related resources in the response. Valid values are: `route`, `service_instance`'
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at` and `updated_at`
    responses:
      '200':
        description: Request succeeded
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ServiceRouteBindingList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 3
                    total_pages: 2
                    first:
                      href: https://api.example.org/v3/service_route_bindings?page=1&per_page=2
                    last:
                      href: https://api.example.org/v3/service_route_bindings?page=2&per_page=2
                    next:
                      href: https://api.example.org/v3/service_route_bindings?page=2&per_page=2
                    previous: null
