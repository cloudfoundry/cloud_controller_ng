  post:
    summary: Create a service route binding
    description: |-
      This endpoint creates a new route service binding. The service instance and the route
      must be in the same space.

      To bind a route to a user-provided service instance, the service instance must
      have the `route_service_url` property set.

      To bind a route to a managed service instance, the service offering must be bindable,
      and the service offering must have `route_forwarding` set in the `requires` property.

      **Permitted roles:** Admin, Space Developer, Space Supporter
    operationId: createServiceRouteBinding
    tags:
      - Service Route Bindings
    requestBody:
      description: A request to create a service route binding
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceRouteBindingCreate.yaml
          examples:
            default:
              summary: default
              value:
                metadata:
                  annotations:
                    foo: bar
                  labels:
                    baz: qux
                relationships:
                  route:
                    data:
                      guid: 7304bc3c-7010-11ea-8840-48bf6bec2d78
                  service_instance:
                    data:
                      guid: e0e4417c-74ee-11ea-a604-48bf6bec2d78
                parameters:
                  key1: value1
                  key2: value2
    responses:
      '201':
        description: User-provided service instance route binding created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ServiceRouteBinding.yaml
            examples:
              default:
                summary: default
                value:
                  guid: dde5ad2a-d8f4-44dc-a56f-0452d744f1c3
                  created_at: '2015-11-13T17:02:56Z'
                  updated_at: '2016-06-08T16:41:26Z'
                  route_service_url: https://route-service-url.io
                  last_operation:
                    type: create
                    state: succeeded
                    description: Operation succeeded
                    updated_at: '2020-03-10T15:49:32Z'
                    created_at: '2020-03-10T15:49:29Z'
                  metadata:
                    annotations:
                      foo: bar
                    labels:
                      baz: qux
                  relationships:
                    service_instance:
                      data:
                        guid: 8bfe4c1b-9e18-45b1-83be-124163f31f9e
                    route:
                      data:
                        guid: 74f7c078-0934-470f-9883-4fdd555b8f13
                  links:
                    self:
                      href: https://api.example.org/v3/service_route_bindings/dde5ad2a-d8f4-44dc-a56f-0452d744f1c3
                    service_instance:
                      href: https://api.example.org/v3/service_instances/8bfe4c1b-9e18-45b1-83be-124163f31f9e
                    route:
                      href: https://api.example.org/v3/routes/74f7c078-0934-470f-9883-4fdd555b8f13
        links:
          route:
            operationId: getRoute
            parameters:
              guid: $response.body#/relationships/route/data/guid
            description: Retrieve the route for this service route binding
          service_instance:
            operationId: getServiceInstance
            parameters:
              guid: $response.body#/relationships/service_instance/data/guid
            description: Retrieve the service instance for this service route binding
      '202':
        description: Managed service instance route binding creation accepted; the binding is being created asynchronously
        headers:
          Location:
            description: URL of the [job](#jobs) that is creating the service route binding
            schema:
              type: string
              format: uri
              examples:
                - https://api.example.org/v3/jobs/af5c57f6-8769-41fa-a499-2c84ed896788
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
