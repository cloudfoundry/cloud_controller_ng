/v3/service_offerings:
  get:
    summary: List service offerings
    description: |-
      This endpoint retrieves the service offerings the user has access to.

      **Permitted roles:** All Roles, Unauthenticated Users *(for service offerings with public plans, unless `hide_marketplace_from_unauthenticated_users` is set)*
    operationId: listServiceOfferings
    tags:
      - Service Offerings
    parameters:
      - name: names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of names to filter by (case-insensitive)
      - name: available
        in: query
        required: false
        schema:
          type: boolean
        description: Filter by the `available` property; valid values are `true` or `false`
      - name: broker_catalog_ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of IDs provided by the service broker for the service offering to filter by
      - name: service_broker_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service broker GUIDs to filter by
      - name: service_broker_names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service broker names to filter by (case-sensitive)
      - name: space_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space GUIDs to filter by
      - name: organization_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization GUIDs to filter by
      - $ref: ../components/parameters/LabelSelector.yaml
      - name: fields
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            service_broker:
              type: string
              description: Comma-delimited list of keys; valid values are `guid`, `name`
        description: |-
          [Fields parameter](#fields-parameter) used to include specific fields of related resources in the response.

          Service offerings list fields:

          Resource | Allowed Keys
          --- | ---
          `service_broker` | `guid`, `name`
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
            - name
            - -name
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at`, `updated_at` and `name`
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ServiceOfferingList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 3
                    total_pages: 2
                    first:
                      href: https://api.example.org/v3/service_offerings?page=1&per_page=2
                    last:
                      href: https://api.example.org/v3/service_offerings?page=2&per_page=2
                    next:
                      href: https://api.example.org/v3/service_offerings?page=2&per_page=2
                    previous: null
                  resources:
                    - guid: bf7eb420-11e5-11ea-b7db-4b5d5e7976a9
                      name: my_service_offering
                      description: Provides my service
                      available: true
                      tags:
                        - relational
                        - caching
                      requires: []
                      created_at: '2019-11-28T13:44:02Z'
                      updated_at: '2019-11-28T13:44:02Z'
                      shareable: true
                      documentation_url: https://some-documentation-link.io
                      broker_catalog:
                        id: db730a8c-11e5-11ea-838a-0f4fff3b1cfb
