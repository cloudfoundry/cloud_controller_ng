        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
/v3/buildpacks/{guid}/upload:
  post:
    summary: Upload buildpack bits
    description: |-
      Upload a zip file containing a Cloud Foundry compatible buildpack. The file must be sent as part of a multi-part form.

      **Permitted roles:** Admin
    operationId: uploadBuildpack
    tags:
      - Buildpacks
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    requestBody:
      description: The buildpack file to be uploaded, sent as part of a multi-part form
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              bits:
                type: string
                format: binary
                description: A binary zip file containing the buildpack bits
            required:
              - bits
            description: Request schema for uploading buildpack bits
    responses:
      '202':
        description: Accepted
        headers:
          Location:
            description: URL of the [job](#jobs) that is processing the buildpack bits
            schema:
              type: string
              format: uri
              examples:
                - https://api.example.org/v3/jobs/af5c57f6-8769-41fa-a499-2c84ed896788
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Buildpack.yaml
            examples:
              default:
                summary: default
                value:
                  guid: fd35633f-5c5c-4e4e-a5a9-0722c970a9d2
                  created_at: '2016-03-18T23:26:46Z'
                  updated_at: '2016-10-17T20:00:42Z'
                  name: ruby_buildpack
                  state: AWAITING_UPLOAD
                  filename: null
                  stack: windows64
                  position: 42
                  lifecycle: buildpack
                  enabled: true
                  locked: false
                  metadata:
                    labels: {}
                    annotations: {}
                  links:
                    self:
                      href: https://api.example.org/v3/buildpacks/fd35633f-5c5c-4e4e-a5a9-0722c970a9d2
                    upload:
                      href: https://api.example.org/v3/buildpacks/fd35633f-5c5c-4e4e-a5a9-0722c970a9d2/upload
                      method: POST
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
