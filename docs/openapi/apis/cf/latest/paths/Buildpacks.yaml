/v3/buildpacks:
  get:
    summary: List buildpacks
    description: |-
      Retrieve all buildpacks the user has access to.

      **Permitted roles:** All Roles
    operationId: listBuildpacks
    tags:
      - Buildpacks
    parameters:
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of buildpack names to filter by (case-sensitive)
      - name: stacks
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of stack names to filter by (case-sensitive)
      - name: lifecycle
        in: query
        required: false
        schema:
          type: string
          enum:
            - buildpack
            - cnb
        description: Type of buildpack. Valid values are `buildpack` and `cnb`
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
            - lifecycle
            - -lifecycle
            - position
            - -position
        description: Value to sort by; defaults to ascending. Prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`, `lifecycle`, and `position`
      - $ref: ../components/parameters/LabelSelector.yaml
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/BuildpackList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 3
                    total_pages: 2
                    first:
                      href: https://api.example.org/v3/buildpacks?page=1&per_page=2
                    last:
                      href: https://api.example.org/v3/buildpacks?page=2&per_page=2
                    next:
                      href: https://api.example.org/v3/buildpacks?page=2&per_page=2
                    previous: null
                  resources:
                    - guid: fd35633f-5c5c-4e4e-a5a9-0722c970a9d2
                      created_at: '2016-03-18T23:26:46Z'
                      updated_at: '2016-10-17T20:00:42Z'
                      name: my-buildpack
                      state: AWAITING_UPLOAD
                      filename: null
                      stack: my-stack
                      position: 1
                      lifecycle: cnb
                      enabled: true
                      locked: false
                      metadata:
                        labels: {}
                        annotations: {}
                      links:
                        self:
                          href: https://api.example.org/v3/buildpacks/fd35633f-5c5c-4e4e-a5a9-0722c970a9d2
                        upload:
                          href: https://api.example.org/v3/buildpacks/fd35633f-5c5c-4e4e-a5a9-0722c970a9d2/upload
                          method: POST
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '502':
        $ref: ../components/responses/BadGateway.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
  post:
    summary: Create a buildpack
    description: '**Permitted roles:** Admin'
    operationId: createBuildpack
    tags:
      - Buildpacks
    requestBody:
      $ref: ../components/requestBodies/BuildpackCreateRequestBody.yaml
    responses:
      '201':
        $ref: ../components/responses/BuildpackCreateResponse.yaml
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
