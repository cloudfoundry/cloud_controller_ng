/v3/info:
  get:
    summary: Get platform info
    description: |-
      Get information about the platform.

      **Authentication:** No authentication required.
    operationId: getPlatformInfo
    tags:
      - Info
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Info.yaml
            examples:
              default:
                summary: Response with configured values
                value:
                  build: afa73e3fe
                  cli_version:
                    minimum: 6.22.0
                    recommended: latest
                  custom:
                    arbitrary: stuff
                  description: Put your apps here!
                  name: Cloud Foundry
                  version: 123
                  osbapi_version: '2.15'
                  rate_limits:
                    enabled: true
                    general_limit: 2000
                    reset_interval_in_minutes: 30
                  links:
                    self:
                      href: http://api.example.com/v3/info
                    support:
                      href: http://support.example.com
              unconfigured:
                summary: Response with unconfigured values
                value:
                  build: ''
                  cli_version:
                    minimum: ''
                    recommended: ''
                  custom: {}
                  description: ''
                  name: ''
                  version: 0
                  osbapi_version: ''
                  rate_limits:
                    enabled: false
                    general_limit: 2000
                    reset_interval_in_minutes: 30
                  links:
                    self:
                      href: http://api.example.com/v3/info
                    support:
                      href: ''
      '429':
        $ref: ../components/responses/TooManyRequests.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
/v3/info/usage_summary:
  get:
    summary: Get platform usage summary
    description: |-
      This endpoint retrieves a high-level summary of usage across the entire Cloud Foundry installation.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor
    operationId: getPlatformUsageSummary
    tags:
      - Info
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/InfoUsageSummary.yaml
            examples:
              default:
                summary: default
                value:
                  usage_summary:
                    started_instances: 294
                    memory_in_mb: 123945
                    routes: 300
                    service_instances: 50
                    reserved_ports: 10
                    domains: 5
                    per_app_tasks: 0
                    service_keys: 20
                  links:
                    self:
                      href: http://api.example.com/v3/info/usage_summary
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '500':
        $ref: ../components/responses/500.yaml
