    summary: Delete unmapped routes for a space
    description: |-
      Deletes all routes in a space that are not mapped to any applications and not bound to any service instances.

      > **Note:** `unmapped=true` is a required query parameter; always include it.

      **Permitted roles:** Admin, Space Developer, Space Supporter
    operationId: deleteUnmappedRoutesForSpace
    tags:
      - Spaces
    parameters:
      - $ref: ../components/parameters/Guid.yaml
      - name: unmapped
        in: query
        required: true
        schema:
          type: boolean
          enum:
            - true
        description: Required query parameter; must be `true`. Only unmapped routes may be mass deleted
    responses:
      '202':
        description: Accepted
        headers:
          Location:
            description: URL of the job that is deleting unmapped routes
            schema:
              type: string
              format: uri
      '401':
