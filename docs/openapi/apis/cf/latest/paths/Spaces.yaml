/v3/spaces:
  get:
    summary: List spaces
    description: |-
      Retrieve all spaces the user has access to.

      **Permitted roles:** All Roles
    operationId: listSpaces
    tags:
      - Spaces
    parameters:
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
            - name
            - -name
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`, `name`
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
      - $ref: ../components/parameters/LabelSelector.yaml
      - name: names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space names to filter by (case-insensitive)
      - name: guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space guids to filter by
      - name: organization_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization guids to filter by
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
              - organization
        description: Optionally include a list of unique related resources in the response; valid value is `organization`
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/SpaceList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 2
                    total_pages: 1
                    first:
                      href: https://api.example.org/v3/spaces?page=1&per_page=50
                    last:
                      href: https://api.example.org/v3/spaces?page=1&per_page=50
