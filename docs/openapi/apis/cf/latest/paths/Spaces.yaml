/v3/spaces/{guid}/actions/apply_manifest:
  post:
    summary: Apply a manifest to a space
    description: |-
      Apply changes specified in a manifest to the named apps and their underlying processes. The apps must reside in the space. These changes are additive and will not modify any unspecified properties or remove any existing environment variables, app features, routes, or services.

      > **Note:** Apply manifest will only trigger an immediate update for the "instances" property or routing changes. All other properties require an app restart to take effect.

      **Permitted roles:** Admin, Space Developer
    operationId: applyManifestToSpace
    tags:
      - Spaces
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    requestBody:
      description: The manifest to apply, as a YAML document
      required: true
      content:
        application/x-yaml:
          schema:
            type: string
          examples:
            default:
              summary: default
              value: |
                ---
                applications:
                - name: my-app
                  instances: 2
                  memory: 512M
    responses:
      '202':
        description: Accepted
        headers:
          Location:
            description: URL of the job that is applying the manifest
            schema:
              type: string
              format: uri
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
