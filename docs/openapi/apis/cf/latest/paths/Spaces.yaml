/v3/spaces/{guid}/manifest_diff:
  post:
    summary: Create a manifest diff for a space (experimental)
    description: |-
      This endpoint returns a JSON representation of the difference between the provided manifest and the current state of a space.

      Currently, this endpoint can only diff [version 1](#the-manifest-schema) manifests.

      **Permitted roles:** Admin, Space Developer
    operationId: createManifestDiffForSpace
    tags:
      - Spaces
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    requestBody:
      description: The manifest to compare against the current state of the space, as a YAML document
      required: true
      content:
        application/x-yaml:
          schema:
            type: string
          examples:
            default:
              summary: default
              value: |
                ---
                applications:
                - name: my-app
                  instances: 2
                  memory: 512M
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              type: object
              properties:
                diff:
                  type: array
                  description: The list of differences between the provided manifest and the current state of the space; the diff object format is inspired by the [JSON Patch specification](https://tools.ietf.org/html/rfc6902)
                  items:
                    type: object
                    properties:
                      op:
                        type: string
                        enum:
                          - add
                          - remove
                          - replace
                        description: Type of change; valid values are `add`, `remove`, `replace`
                      path:
                        type: string
                        description: Path to changing manifest field
                      was:
                        description: For `remove` and `replace` operations, the previous value; otherwise key is omitted
                      value:
                        description: For `add` and `replace` operations, the new value; otherwise key is omitted
                    required:
                      - op
                      - path
              required:
                - diff
            examples:
              default:
                summary: default
                value:
                  diff:
                    - op: remove
                      path: /applications/0/routes/1
                      was:
                        route: route.example.com
                    - op: add
                      path: /applications/1/buildpacks/2
                      value: java_buildpack
                    - op: replace
                      path: /applications/2/processes/1/memory
                      was: 256M
                      value: 512M
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
