get:
  summary: Global API Root
  description: |-
    This endpoint returns links to the APIs available on a given Cloud Foundry deployment.

    **Authentication:** No authentication required.
  operationId: getApiRoot
  tags:
    - Root
  security: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              links:
                type: object
                description: Links to related resources
                properties:
                  self:
                    allOf:
                      - $ref: '../components/schemas/IndexLink.yaml'
                      - description: Link to the current endpoint
                  cloud_controller_v2:
                    allOf:
                      - $ref: '../components/schemas/IndexLink.yaml'
                      - description: Link to the Cloud Controller V2 API; `meta.version` contains the V2 API version
                  cloud_controller_v3:
                    allOf:
                      - $ref: '../components/schemas/IndexLink.yaml'
                      - description: Link to the Cloud Controller V3 API; `meta.version` contains the V3 API version
                  network_policy_v0:
                    allOf:
                      - $ref: '../components/schemas/IndexLink.yaml'
                      - description: Link to the Network Policy V0 API
                  network_policy_v1:
                    allOf:
                      - $ref: '../components/schemas/IndexLink.yaml'
                      - description: Link to the Network Policy V1 API
                  login:
                    allOf:
                      - $ref: '../components/schemas/IndexLink.yaml'
                      - description: Link to the login server
                  uaa:
                    allOf:
                      - $ref: '../components/schemas/IndexLink.yaml'
                      - description: Link to the UAA API
                  credhub:
                    oneOf:
                      - $ref: '../components/schemas/IndexLink.yaml'
                      - type: "null"
                    description: Link to the CredHub API; `null` when CredHub is not available
                  routing:
                    allOf:
                      - $ref: '../components/schemas/IndexLink.yaml'
                      - description: Link to the Routing API
                  logging:
                    allOf:
                      - $ref: '../components/schemas/IndexLink.yaml'
                      - description: Link to the Logging API
                  log_cache:
                    allOf:
                      - $ref: '../components/schemas/IndexLink.yaml'
                      - description: Link to the Log Cache API
                  log_stream:
                    allOf:
                      - $ref: '../components/schemas/IndexLink.yaml'
                      - description: Link to the Log Stream API
                  app_ssh:
                    allOf:
                      - $ref: '../components/schemas/IndexLink.yaml'
                      - description: Link to the app SSH proxy; `meta.host_key_fingerprint` and `meta.oauth_client` describe the SSH endpoint
          examples:
            default:
              summary: default
              value:
                links:
                  self:
                    href: https://api.example.org
                  cloud_controller_v2:
                    href: https://api.example.org/v2
                    meta:
                      version: 2.155.0
                  cloud_controller_v3:
                    href: https://api.example.org/v3
                    meta:
                      version: 3.90.0
                  network_policy_v0:
                    href: https://api.example.org/networking/v0/external
                  network_policy_v1:
                    href: https://api.example.org/networking/v1/external
                  login:
                    href: https://login.example.org
                  uaa:
                    href: https://uaa.example.org
                  credhub: null
                  routing:
                    href: https://api.example.org/routing
                  logging:
                    href: wss://doppler.example.org:443
                  log_cache:
                    href: https://log-cache.example.org
                  log_stream:
                    href: https://log-stream.example.org
                  app_ssh:
                    href: ssh.example.org:2222
                    meta:
                      host_key_fingerprint: Y411oivJwZCUQnXHq83mdM5SKCK4ftyoSXI31RRe4Zs
                      oauth_client: ssh-proxy
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '500':
      $ref: '../components/responses/500.yaml'
