  post:
    summary: Create a service instance
    description: |-
      This endpoint creates a new service instance. Service instances can be of type `managed` or `user-provided`, and
      the required parameters are different for each type. User provided service instances do not require interactions with
      service brokers.

      If failures occur when creating managed service instances, the API might execute orphan mitigation steps
      accordingly to cases outlined in the [OSBAPI specification](https://github.com/openservicebrokerapi/servicebroker/blob/master/spec.md#orphan-mitigation)

      **Permitted roles:** Admin, Space Developer
    operationId: createServiceInstance
    tags:
      - Service Instances
    requestBody:
      $ref: ../components/requestBodies/ServiceInstanceCreateRequestBody.yaml
    responses:
      '201':
        description: User-provided service instance created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/UserProvidedServiceInstance.yaml
            examples:
              user_provided_service_instance:
                summary: User-provided service instance
                value:
                  guid: 88ce23e5-27c3-4381-a2df-32a28ec43133
                  created_at: '2020-03-10T15:56:08Z'
                  updated_at: '2020-03-10T15:56:08Z'
                  last_operation:
                    type: create
                    state: succeeded
                    description: Operation succeeded
                    updated_at: '2020-03-10T15:49:32Z'
                    created_at: '2020-03-10T15:49:29Z'
                  name: my-user-provided-instance
                  tags:
                    - sql
                  type: user-provided
                  syslog_drain_url: http://logs.com
                  route_service_url: https://routes.com
                  relationships:
                    space:
                      data:
                        guid: 5a84d315-9513-4d74-95e5-f6a5501eeef7
                  metadata:
                    labels:
                      baz: qux
                    annotations:
                      foo: bar
                  links:
                    self:
                      href: https://api.example.org/v3/service_instances/88ce23e5-27c3-4381-a2df-32a28ec43133
                    space:
                      href: https://api.example.org/v3/spaces/5a84d315-9513-4d74-95e5-f6a5501eeef7
                    credentials:
                      href: https://api.example.org/v3/service_instances/88ce23e5-27c3-4381-a2df-32a28ec43133/credentials
                    service_credential_bindings:
                      href: https://api.example.org/v3/service_credential_bindings?service_instance_guids=88ce23e5-27c3-4381-a2df-32a28ec43133
                    service_route_bindings:
                      href: https://api.example.org/v3/service_route_bindings?service_instance_guids=88ce23e5-27c3-4381-a2df-32a28ec43133
        links:
          space:
            operationId: getSpace
            parameters:
              guid: $response.body#/relationships/space/data/guid
            description: Retrieve the space for this service instance
      '202':
        description: Managed service instance creation accepted; the instance is being created asynchronously
        headers:
          Location:
            description: URL of the [job](#jobs) that is creating the service instance
            schema:
              type: string
              format: uri
              examples:
