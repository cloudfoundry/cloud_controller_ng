  delete:
    summary: Delete a service instance
    description: |-
      This endpoint deletes a service instance and any associated service credential
      bindings or service route bindings. The service instance is removed from all
      spaces where it is available.

      User provided service instances do not require interactions with service brokers,
      therefore the API will respond synchronously to the delete request.

      For managed service instances, the API will respond asynchronously.
      If a service credential binding or service route binding cannot be deleted
      synchronously, then the operation will fail, and the deletion of the binding
      will continue in the background. The operation can be retried until it is successful.

      **Permitted roles:** Admin, Space Developer *(Can only purge service instances from space-scoped brokers)*
    operationId: deleteServiceInstance
    tags:
      - Service Instances
    parameters:
      - $ref: ../components/parameters/Guid.yaml
      - name: purge
        in: query
        required: false
        schema:
          type: boolean
        description: If `true`, deletes the service instance and all associated resources without any interaction with the service broker.
    responses:
      '202':
        description: Managed service instance deletion accepted; the instance is being deleted asynchronously
        headers:
          Location:
            description: URL of the [job](#jobs) that is deleting the service instance
            schema:
              type: string
              format: uri
              examples:
                - https://api.example.org/v3/jobs/af5c57f6-8769-41fa-a499-2c84ed896788
      '204':
        description: User-provided service instance deleted, or the service instance was purged
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
