/v3/service_instances/{guid}/credentials:
  get:
    summary: Get credentials for a user-provided service instance
    description: |-
      Retrieves the credentials for a user-provided service instance.
      This endpoint is not available for managed service instances.

      **Permitted roles:** Admin, Admin Read-Only, Space Developer, Space Manager
    operationId: getServiceInstanceCredentials
    tags:
      - Service Instances
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    responses:
      '200':
        description: The credentials of the user-provided service instance
        content:
          application/json:
            schema:
              type: object
              description: The JSON object that was supplied as the `credentials` of the user-provided service instance
            examples:
              default:
                summary: default
                value:
                  username: my-username
                  password: super-secret
                  other: credential
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
/v3/service_instances/{guid}/relationships/shared_spaces/usage_summary:
  get:
    summary: Get usage summary in shared spaces
    description: |-
      This endpoint returns the number of bound apps in spaces where the service instance has been shared to.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager, Space Auditor, Space Developer, Space Manager, Space Supporter
    operationId: getServiceInstanceUsageSummaryInSharedSpaces
    tags:
      - Service Instances
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    responses:
      '200':
        description: The usage summary for each space the service instance is shared to
        content:
          application/json:
            schema:
              type: object
              properties:
                usage_summary:
                  type: array
                  items:
                    type: object
                    properties:
                      space:
                        $ref: ../components/schemas/Relationship.yaml
                        description: The space the service instance has been shared to
                      bound_app_count:
                        type: integer
                        description: The number of apps bound to the service instance in that space
                  description: One entry for each space the service instance has been shared to
                links:
                  type: object
                  properties:
                    self:
                      $ref: ../components/schemas/Link.yaml
                      description: Link to this usage summary
                    shared_spaces:
                      $ref: ../components/schemas/Link.yaml
                      description: Link to the spaces this service instance has been shared to
                    service_instance:
                      $ref: ../components/schemas/Link.yaml
                      description: Link to the service instance
                  description: Links to related resources
            examples:
              default:
                summary: default
                value:
                  usage_summary:
                    - space:
                        guid: 68d54d31-9b3a-463b-ba94-e8e4c32edbac
                      bound_app_count: 2
                    - space:
                        guid: b19f6525-cbd3-4155-b156-dc0c2a431b4c
                      bound_app_count: 0
                  links:
                    self:
                      href: https://api.example.org/v3/service_instances/bdeg4371-cbd3-4155-b156-dc0c2a431b4c/relationships/shared_spaces/usage_summary
                    shared_spaces:
                      href: https://api.example.org/v3/service_instances/bdeg4371-cbd3-4155-b156-dc0c2a431b4c/relationships/shared_spaces
                    service_instance:
                      href: https://api.example.org/v3/service_instances/bdeg4371-cbd3-4155-b156-dc0c2a431b4c
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
/v3/service_instances/{guid}/relationships/shared_spaces:
  get:
    summary: List shared spaces relationship
    description: |-
      This endpoint lists the spaces that the service instance has been shared to.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager, Space Auditor, Space Developer, Space Manager, Space Supporter
    operationId: listServiceInstanceSharedSpaces
    tags:
      - Service Instances
    parameters:
      - $ref: ../components/parameters/Guid.yaml
      - name: fields
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            space:
              type: string
              description: Comma-delimited list of keys; valid values are `guid`, `name`, `relationships.organization`
            space.organization:
              type: string
              description: Comma-delimited list of keys; valid values are `guid`, `name`
        description: |-
          [Fields parameter](#fields-parameter) used to include specific fields of related resources in the response.

          Shared spaces list fields:

          Resource | Allowed Keys
          --- | ---
          `space` | `guid`, `name`, `relationships.organization`
          `space.organization` | `guid`, `name`
    responses:
      '200':
        description: The spaces the service instance has been shared to
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RelationshipToMany.yaml
            examples:
              default:
                summary: default
                value:
                  data:
                    - guid: 68d54d31-9b3a-463b-ba94-e8e4c32edbac
                    - guid: b19f6525-cbd3-4155-b156-dc0c2a431b4c
                  links:
                    self:
                      href: https://api.example.org/v3/service_instances/bdeg4371-cbd3-4155-b156-dc0c2a431b4c/relationships/shared_spaces
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
  post:
    summary: Share a service instance to other spaces
    description: |-
      This endpoint shares the service instance with the specified spaces.
      In order to share into a space the requesting user must be a space developer in the target space.

      **Permitted roles:** Admin, Space Developer
    operationId: shareServiceInstance
    tags:
      - Service Instances
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    requestBody:
      description: The spaces to share this service instance to
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/Relationship.yaml
                description: Shared space relationships; each space will have this service instance shared to it
          examples:
            default:
              summary: default
              value:
                data:
                  - guid: 68d54d31-9b3a-463b-ba94-e8e4c32edbac
                  - guid: b19f6525-cbd3-4155-b156-dc0c2a431b4c
    responses:
      '200':
        description: The spaces the service instance has been shared to
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RelationshipToMany.yaml
            examples:
              default:
                summary: default
                value:
                  data:
                    - guid: 68d54d31-9b3a-463b-ba94-e8e4c32edbac
                    - guid: b19f6525-cbd3-4155-b156-dc0c2a431b4c
                  links:
                    self:
                      href: https://api.example.org/v3/service_instances/bdeg4371-cbd3-4155-b156-dc0c2a431b4c/relationships/shared_spaces
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
/v3/service_instances/{guid}/relationships/shared_spaces/{space_guid}:
  delete:
    summary: Unshare a service instance from another space
    description: |-
      This endpoint unshares the service instance from the specified space. This will automatically unbind any applications bound to this service instance in the specified space.
      Unsharing a service instance from a space will not delete any service keys.

      **Permitted roles:** Admin, Space Developer
    operationId: unshareServiceInstance
    tags:
      - Service Instances
    parameters:
      - $ref: ../components/parameters/Guid.yaml
      - name: space_guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The GUID of the space to unshare the service instance from
    responses:
      '204':
        description: Service instance unshared from the space
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
/v3/service_instances/{guid}/parameters:
  get:
    summary: Get parameters for a managed service instance
    description: |-
      Queries the Service Broker for the parameters associated with this service instance.
      The broker catalog must have enabled the `instances_retrievable` feature for the Service Offering.
      Check the [Service Offering object](#the-service-offering-object) for the value of this feature flag.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager, Space Auditor, Space Developer, Space Manager
    operationId: getServiceInstanceParameters
    tags:
      - Service Instances
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    responses:
      '200':
        description: The parameters the service instance was created or updated with
        content:
          application/json:
            schema:
              type: object
              description: The JSON object of parameters returned by the service broker
            examples:
              default:
                summary: default
                value:
                  key_1: value_1
                  key_2: value_2
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
/v3/service_instances/{guid}/permissions:
  get:
    summary: Get permissions for a service instance
    description: |-
      Get the current user's permissions for the given service instance. If a user can get a service instance then they can 'read' it. Users who can update a service instance can 'manage' it.

      This endpoint's primary purpose is to enable third-party service dashboards to determine the permissions of a given Cloud Foundry user that has authenticated with the dashboard via single sign-on (SSO). For more information, see the Cloud Foundry documentation on [Dashboard Single Sign-On](https://docs.cloudfoundry.org/services/dashboard-sso.html).

      **Permitted roles:** All Roles
    operationId: getServiceInstancePermissions
    tags:
      - Service Instances
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    responses:
      '200':
        description: The current user's permissions for the service instance
        content:
          application/json:
            schema:
              type: object
              properties:
                read:
                  type: boolean
                  description: Whether the current user can read the service instance
                manage:
                  type: boolean
                  description: Whether the current user can update the service instance
            examples:
              default:
                summary: default
                value:
                  read: true
                  manage: false
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
/v3/service_instances/{guid}:
  get:
    summary: Get a service instance
    description: |-
      This endpoint retrieves the service instance by GUID.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager, Space Auditor, Space Developer, Space Manager, Space Supporter
    operationId: getServiceInstance
    tags:
      - Service Instances
    parameters:
      - $ref: ../components/parameters/Guid.yaml
      - name: fields
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            space:
              type: string
              description: Comma-delimited list of keys; valid values are `guid`, `name`
            space.organization:
              type: string
              description: Comma-delimited list of keys; valid values are `name`, `guid`
            service_plan:
              type: string
              description: Comma-delimited list of keys; valid values are `name`, `guid`
            service_plan.service_offering:
              type: string
              description: Comma-delimited list of keys; valid values are `name`, `guid`, `description`, `documentation_url`, `tags`
            service_plan.service_offering.service_broker:
              type: string
              description: Comma-delimited list of keys; valid values are `name`, `guid`
        description: |-
          [Fields parameter](#fields-parameter) used to include specific fields of related resources in the response.

          Service instance fields:

          Resource | Allowed Keys
          --- | ---
          `space` | `guid`, `name`
          `space.organization` | `name`, `guid`
          `service_plan` | `name`, `guid`
          `service_plan.service_offering` | `name`, `guid`, `description`, `documentation_url`, `tags`
          `service_plan.service_offering.service_broker` | `name`, `guid`
    responses:
      '200':
        description: The requested service instance
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../components/schemas/ManagedServiceInstance.yaml
                - $ref: ../components/schemas/UserProvidedServiceInstance.yaml
              discriminator:
                propertyName: type
