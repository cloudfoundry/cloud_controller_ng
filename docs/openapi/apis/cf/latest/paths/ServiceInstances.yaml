/v3/service_instances:
  get:
    summary: List service instances
    description: |-
      This endpoint retrieves the service instances the user has access to, including access granted by service instance sharing.

      **Permitted roles:** All Roles
    operationId: listServiceInstances
    tags:
      - Service Instances
    parameters:
      - name: names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service instance names to filter by (case-sensitive)
      - name: guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service instance guids to filter by
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
            - managed
            - user-provided
        description: Filter by type; valid values are `managed` and `user-provided`
      - name: space_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space guids to filter by
      - name: organization_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization guids to filter by
      - name: service_plan_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service plan guids to filter by
      - name: service_plan_names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service plan names to filter by (case-insensitive)
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
            - name
            - -name
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`, and `name`
      - $ref: ../components/parameters/LabelSelector.yaml
      - name: fields
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            space:
              type: string
              description: Comma-delimited list of keys; valid values are `guid`, `name`, `relationships.organization`
            space.organization:
              type: string
              description: Comma-delimited list of keys; valid values are `guid`, `name`
            service_plan:
              type: string
              description: Comma-delimited list of keys; valid values are `guid`, `name`, `relationships.service_offering`
            service_plan.service_offering:
              type: string
              description: Comma-delimited list of keys; valid values are `guid`, `name`, `description`, `documentation_url`, `tags`, `relationships.service_broker`
            service_plan.service_offering.service_broker:
              type: string
              description: Comma-delimited list of keys; valid values are `guid`, `name`
        description: |-
          [Fields parameter](#fields-parameter) used to include specific fields of related resources in the response.

          Service instances list fields:

          Resource | Allowed Keys
          --- | ---
          `space` | `guid`, `name`, `relationships.organization`
          `space.organization` | `guid`, `name`
          `service_plan` | `guid`, `name`, `relationships.service_offering`
          `service_plan.service_offering` | `guid`, `name`, `description`, `documentation_url`, `tags`, `relationships.service_broker`
          `service_plan.service_offering.service_broker` | `guid`, `name`
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
    responses:
      '200':
        description: Request succeeded
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ServiceInstanceList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 2
                    total_pages: 1
                    first:
                      href: https://api.example.org/v3/service_instances?page=1&per_page=50
                    last:
                      href: https://api.example.org/v3/service_instances?page=1&per_page=50
                    next: null
                    previous: null
                  resources:
                    - guid: c89b3280-fe8d-4aa0-a42e-44465bb1c61c
                      created_at: '2020-03-10T15:49:29Z'
                      updated_at: '2020-03-10T15:49:29Z'
                      name: my-managed-instance
                      tags: []
                      type: managed
                      maintenance_info:
                        version: '1.0.0'
                      upgrade_available: false
                      dashboard_url: https://service-broker.example.org/dashboard
                      broker_provided_metadata:
                        labels:
                          service_engine_version: '16.6'
                        attributes:
                          max_connections: '100'
                      last_operation:
                        type: create
                        state: succeeded
