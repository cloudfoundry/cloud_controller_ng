  patch:
    summary: Update a service instance
    description: |-
      This endpoint updates a service instance. The permitted parameters differ between `managed` and `user-provided` service instances.

      Some updates can be performed entirely within the Cloud Controller in which case the response is synchronous.
      Some updates require communication with the service broker, in which case the response will be asynchronous.
      The response will be asynchronous if any of these parameters are specified:

      * `parameters`
      * `service_plan`
      * `maintenance_info`
      * `name` - when the service offering has `allow_context_updates` feature enabled

      Otherwise the response will be synchronous.

      **Permitted roles:** Admin, Space Developer
    operationId: updateServiceInstance
    tags:
      - Service Instances
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    requestBody:
      $ref: ../components/requestBodies/ServiceInstanceUpdateRequestBody.yaml
    responses:
      '200':
        description: Service instance updated synchronously
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../components/schemas/ManagedServiceInstance.yaml
                - $ref: ../components/schemas/UserProvidedServiceInstance.yaml
              discriminator:
                propertyName: type
                mapping:
                  managed: ../components/schemas/ManagedServiceInstance.yaml
                  user-provided: ../components/schemas/UserProvidedServiceInstance.yaml
