/v3/packages/{guid}/upload:
  post:
    summary: Upload package bits
    description: |-
      This upload endpoint takes a multi-part form requests for packages of type `bits`. The request requires either a [.zip file](https://en.wikipedia.org/wiki/Zip_(file_format)) uploaded under the `bits` field or a list of [resource match objects](#the-resource-match-object) under the `resources` field. These field may be used together.

      The `resources` field in the request accepts the v2 resources object format.

      **Permitted roles:** Admin, Space Developer
    operationId: uploadPackageBits
    tags:
      - Packages
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    requestBody:
