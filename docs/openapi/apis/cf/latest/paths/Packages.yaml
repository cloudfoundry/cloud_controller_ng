/v3/packages:
  get:
    summary: List packages
    description: |-
      Retrieve all packages the user has access to.

      **Permitted roles:** All Roles
    operationId: listPackages
    tags:
      - Packages
    parameters:
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        description: Value to sort by; defaults to ascending. Prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
      - $ref: ../components/parameters/LabelSelector.yaml
      - name: guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of package guids to filter by
      - name: states
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
              - AWAITING_UPLOAD
              - PROCESSING_UPLOAD
              - READY
              - FAILED
              - COPYING
              - EXPIRED
        description: Comma-delimited list of package states to filter by
      - name: types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
              - bits
              - docker
        description: Comma-delimited list of package types to filter by
      - name: app_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of app guids to filter by
      - name: space_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space guids to filter by
      - name: organization_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization guids to filter by
    responses:
      '200':
        description: List of packages
        content:
          application/json:
            schema:
              $ref: ../components/schemas/PackageList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 2
                    total_pages: 1
                    first:
                      href: https://api.example.org/v3/packages?types=bits%2Cdocker&page=1&per_page=2
                    last:
                      href: https://api.example.org/v3/packages?types=bits%2Cdocker&page=1&per_page=2
                    next: null
                    previous: null
                  resources:
                    - guid: a57fd932-85db-483a-a27e-b00efbb3b0a4
                      type: bits
