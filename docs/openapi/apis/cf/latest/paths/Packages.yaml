  post:
    summary: Create or copy a package
    description: |-
      Create a package.

      **Copy a package:** supplying the optional `source_guid` query parameter copies the bits of the source package identified by `source_guid` to a target package instead of creating a new package. In copy mode `type` and `data` are not accepted; `relationships.app`, a relationship to the destination app, is the only accepted body parameter.

      **Permitted roles:** Admin, Space Developer
    operationId: createPackage
    tags:
      - Packages
    parameters:
      - name: source_guid
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: GUID of the source package to copy from. When supplied, the bits of that package are copied to a new package for the app given in `relationships.app`
    requestBody:
      $ref: ../components/requestBodies/PackageCreateRequestBody.yaml
    responses:
      '201':
        description: Successfully created (or copied) package
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Package.yaml
