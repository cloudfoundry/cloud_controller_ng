/v3/organizations/{guid}/users:
  get:
    summary: List users for an organization
    description: |-
      Retrieve all users with a role in the specified organization.

      **Permitted roles:** All Roles
    operationId: listUsersForOrganization
    tags:
      - Organizations
    parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the organization
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at` and `updated_at`
      - name: guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of user guids to filter by
      - name: usernames
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of usernames to filter by. Mutually exclusive with **partial_usernames**
      - name: origins
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of user origins (user stores) to filter by, for example, users authenticated by UAA have the origin "uaa"; users authenticated by an LDAP provider have the origin "ldap"; when filtering by origins, usernames must be included
      - name: partial_usernames
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of strings to search by. When using this query parameter, all the users that contain the string provided in their username will be returned. Mutually exclusive with **usernames**
      - $ref: ../components/parameters/LabelSelector.yaml
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
