/v3/organizations:
  get:
    summary: List organizations
    description: |-
      Retrieve all organizations the user has access to.

      **Permitted roles:** All Roles
    operationId: listOrganizations
    tags:
      - Organizations
    parameters:
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
            - name
            - -name
        description: Value to sort by; defaults to ascending. Prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`, and `name`
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
      - $ref: ../components/parameters/LabelSelector.yaml
      - name: names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization names to filter by (case-insensitive)
      - name: guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization guids to filter by
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/OrganizationList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 2
                    total_pages: 1
                    first:
                      href: https://api.example.org/v3/organizations?page=1&per_page=50
                    last:
                      href: https://api.example.org/v3/organizations?page=1&per_page=50
                    next: null
                    previous: null
                  resources:
                    - guid: 885735b5-aea4-4cf5-8e44-961af0e41920
                      created_at: '2017-02-01T01:33:58Z'
                      updated_at: '2017-02-01T01:33:58Z'
