  patch:
    summary: Assign default isolation segment
    description: |-
      Set the default isolation segment for a given organization. Only isolation segments that are entitled to the organization are eligible to be the default isolation segment.

      > **Note:** Apps will not run in the new default isolation segment until they are restarted.

      **Permitted roles:** Admin, Org Manager
    operationId: assignDefaultIsolationSegmentForOrganization
    tags:
      - Organizations
    parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the organization
    requestBody:
      description: The default isolation segment relationship to assign to the organization
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Request schema for assigning an organization's default isolation segment
            properties:
              data:
                oneOf:
                  - $ref: ../components/schemas/Relationship.yaml
                  - type: 'null'
                description: Isolation segment relationship; apps will run in this isolation segment; set data to `null` to remove the relationship
            required:
              - data
          examples:
            default:
              summary: default
              value:
                data:
                  guid: 9d8e007c-ce52-4ea7-8a57-f2825d2c6b39
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/OrganizationDefaultIsolationSegmentRelationship.yaml
            examples:
              default:
                summary: default
                value:
                  data:
                    guid: 9d8e007c-ce52-4ea7-8a57-f2825d2c6b39
                  links:
                    self:
                      href: https://api.example.org/v3/organizations/d4c91047-7b29-4fda-b7f9-04033e5c9c9f/relationships/default_isolation_segment
                    related:
                      href: https://api.example.org/v3/isolation_segments/9d8e007c-ce52-4ea7-8a57-f2825d2c6b39
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
