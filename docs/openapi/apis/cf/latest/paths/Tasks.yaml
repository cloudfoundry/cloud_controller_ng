                      href: https://api.example.org/v3/tasks?page=1&per_page=2
                    last:
                      href: https://api.example.org/v3/tasks?page=2&per_page=2
                    next:
                      href: https://api.example.org/v3/tasks?page=2&per_page=2
                    previous: null
