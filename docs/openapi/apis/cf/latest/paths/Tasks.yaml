/v3/tasks:
  get:
    summary: List tasks
    description: |-
      Retrieve all tasks the user has access to. The `command` field is excluded in the response.

      **Permitted roles:** All Roles
    operationId: listTasks
    tags:
      - Tasks
    parameters:
      - name: guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of task guids to filter by
      - name: names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of task names to filter by (case-insensitive)
      - name: states
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
              - PENDING
              - RUNNING
              - SUCCEEDED
              - CANCELING
              - FAILED
        description: Comma-delimited list of task states to filter by
      - name: app_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of app guids to filter by
      - name: space_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space guids to filter by
      - name: organization_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization guids to filter by
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - "-created_at"
            - updated_at
            - "-updated_at"
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`
      - $ref: ../components/parameters/LabelSelector.yaml
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/TaskList.yaml
            examples:
              default:
                summary: default
