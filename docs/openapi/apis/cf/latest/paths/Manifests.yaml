/v3/apps/{guid}/manifest:
  get:
    summary: Generate a manifest for an app
    description: |-
      Generate a manifest for an app and its underlying processes.

      The manifest is returned as a YAML document (`application/x-yaml`). See the response schema for the full manifest field reference.

      **Permitted roles:** Admin, Admin Read-Only, Space Developer
    operationId: generateManifest
    tags:
      - Manifests
    parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the app
    responses:
      '200':
        description: OK
        content:
          application/x-yaml:
            schema:
              $ref: ../components/schemas/Manifest.yaml
            examples:
              default:
                summary: default
                value: |
                  ---
                  applications:
                  - name: my-app
                    stack: cflinuxfs4
                    features:
                      ssh: true
                      revisions: true
                      service-binding-k8s: false
                      file-based-vcap-services: false
                    services:
                    - my-service
                    routes:
                    - route: my-app.example.com
                      protocol: http1
                    processes:
                    - type: web
                      instances: 2
                      memory: 512M
                      log-rate-limit-per-second: 1KB
                      disk_quota: 1024M
                      health-check-type: http
                      health-check-http-endpoint: /healthy
                      health-check-invocation-timeout: 10
                      health-check-interval: 5
                      readiness-health-check-type: http
                      readiness-health-check-http-endpoint: /ready
                      readiness-health-check-invocation-timeout: 20
                      readiness-health-check-interval: 5
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '502':
        $ref: ../components/responses/BadGateway.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
