/v3/routes/{guid}/relationships/shared_spaces:
  get:
    summary: Lists shared spaces relationship (experimental)
    description: |-
      Lists the spaces that the route has been shared to.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Auditor, Org Manager, Space Auditor, Space Developer, Space Manager, Space Supporter
    operationId: listSharedSpacesRelationship
    tags:
      - Routes
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RelationshipToMany.yaml
            examples:
              default:
                summary: default
                value:
                  data:
                    - guid: 885735b5-aea4-4cf5-8e44-961af0e41920
                    - guid: d4c91047-7b29-4fda-b7f9-04033e5c9c9f
                  links:
                    self:
                      href: https://api.example.org/v3/routes/cbad697f-cac1-48f4-9017-ac08f39dfb31/relationships/shared_spaces
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
  post:
    summary: Share a route with other spaces (experimental)
    description: |-
      This endpoint shares the route with the specified spaces. This allows users with read and write access in both the route's space and a shared space to bind a route to an app in the shared space. In order to share into a space the requesting user must have write permission in the target space.

      **Permitted roles:** Admin, Space Developer, Space Supporter
    operationId: shareRoute
    tags:
      - Routes
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    requestBody:
      description: Shared space relationships; each space will have this route shared to it
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RelationshipToMany.yaml
          examples:
            default:
              summary: default
              value:
                data:
                  - guid: 885735b5-aea4-4cf5-8e44-961af0e41920
                  - guid: d4c91047-7b29-4fda-b7f9-04033e5c9c9f
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RelationshipToMany.yaml
            examples:
              default:
                summary: default
                value:
                  data:
                    - guid: 885735b5-aea4-4cf5-8e44-961af0e41920
                    - guid: d4c91047-7b29-4fda-b7f9-04033e5c9c9f
                  links:
                    self:
                      href: https://api.example.org/v3/routes/cbad697f-cac1-48f4-9017-ac08f39dfb31/relationships/shared_spaces
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
/v3/routes/{guid}/relationships/shared_spaces/{space_guid}:
  delete:
    summary: Unshare a route that was shared with another space (experimental)
    description: |-
      Unshares a route that was shared with another space.

      **Permitted roles:** Admin, Space Developer, Space Supporter
    operationId: unshareRoute
    tags:
      - Routes
    parameters:
      - $ref: ../components/parameters/Guid.yaml
      - name: space_guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The GUID of the space to unshare the route from
    responses:
      '204':
        description: No Content
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
/v3/routes/{guid}/relationships/space:
  patch:
    summary: Transfer ownership (experimental)
    description: |-
      Transfers a the ownership of a route to a another space. Users must have write access for both spaces to perform this action.
      The original owning space will still retain access to the route as a [shared space](#share-a-route-with-other-spaces-experimental).
      To completely remove a space from a route, users will have to use [unshare route](#unshare-a-route-that-was-shared-with-another-space-experimental).

      **Permitted roles:** Admin, Space Developer
    operationId: transferRouteOwnership
    tags:
      - Routes
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    requestBody:
      description: The space to transfer ownership of the route to
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  guid:
                    type: string
                    format: uuid
                    description: The GUID of the space to transfer ownership of the route to
                required:
                  - guid
                description: A relationship to the space that will own the route
            required:
              - data
          examples:
            default:
              summary: default
              value:
                data:
                  guid: 885a8cb3-c07b-4856-b448-eeb10bf36236
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: Status of the ownership transfer
            examples:
              default:
                summary: default
                value:
                  status: ok
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
