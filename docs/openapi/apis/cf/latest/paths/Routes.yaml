/v3/routes:
  get:
    summary: List routes
    description: |-
      Retrieve all routes the user has access to.

      **Permitted roles:** All Roles
    operationId: listRoutes
    tags:
      - Routes
    parameters:
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
      - $ref: ../components/parameters/LabelSelector.yaml
      - name: hosts
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of hostnames to filter by
      - name: paths
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of paths to filter by (e.g. `/path1,/path2`)
      - name: ports
        in: query
        schema:
          type: array
          items:
            type: integer
        description: Comma-delimited list of ports to filter by (e.g. `3306,5432`)
      - name: domain_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of domain guids to filter by
      - name: space_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space guids to filter by
      - name: app_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of app guids to filter by
      - name: organization_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization guids to filter by
      - name: service_instance_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service instance guids to filter by
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
              - domain
              - space.organization
              - space
              - route_policies
        description: Optionally include a list of unique related resources in the response. Valid values are `domain`, `space.organization`, `space`, `route_policies`
    responses:
      '200':
        $ref: ../components/responses/RouteListResponse.yaml
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '502':
        $ref: ../components/responses/BadGateway.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
  post:
    summary: Create a route
    description: |-
      Create a route.

      **Permitted roles:** Admin, Space Developer, Space Supporter
    operationId: createRoute
    tags:
      - Routes
    requestBody:
      $ref: ../components/requestBodies/RouteCreateRequestBody.yaml
    responses:
      '201':
        $ref: ../components/responses/RouteCreateResponse.yaml
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
