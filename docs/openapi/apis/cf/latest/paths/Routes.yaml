/v3/routes/{guid}/destinations/{destination_guid}:
  patch:
    summary: Update a destination protocol for a route
    description: |-
      This endpoint updates the protocol of a route destination (app, port and weight cannot be updated)

      **Permitted roles:** Admin, Space Developer, Space Supporter
    operationId: updateDestinationProtocolForRoute
    tags:
      - Routes
    parameters:
      - $ref: ../components/parameters/Guid.yaml
      - name: destination_guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The GUID of the route destination
    requestBody:
      description: Protocol of the destination
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              protocol:
                type:
                  - string
                  - 'null'
                enum:
                  - http1
                  - http2
                  - tcp
                  - null
                description: Protocol the destination will use. Valid protocols are `http1` or `http2` if route protocol is `http`, `tcp` if route protocol is `tcp`. A `null` value will set it to either `http1` or `tcp` based on the route protocol
          examples:
            default:
              summary: default
              value:
                protocol: http2
    responses:
      '200':
        description: Successfully updated protocol of the destination
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RouteDestination.yaml
            examples:
              default:
                summary: default
                value:
                  guid: 89323d4e-2e84-43e7-83e9-adbf50a20c0e
                  app:
                    guid: 1cb006ee-fb05-47e1-b541-c34179ddc446
                    process:
                      type: web
                  weight: 61
                  port: 8080
                  protocol: http2
                  links:
                    destinations:
                      href: https://api.example.org/v3/routes/cbad697f-cac1-48f4-9017-ac08f39dfb31/destinations
                    route:
                      href: https://api.example.org/v3/routes/cbad697f-cac1-48f4-9017-ac08f39dfb31
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
  delete:
    summary: Remove destination for a route
    description: |-
      Remove a destination from a route.

      **Permitted roles:** Admin, Space Developer, Space Supporter
    operationId: removeDestinationForRoute
    tags:
      - Routes
    parameters:
      - $ref: ../components/parameters/Guid.yaml
      - name: destination_guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The GUID of the route destination to remove
    responses:
      '204':
        description: Successfully removed destination from the route
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
