/v3/service_plans/{guid}/visibility:
  get:
    summary: Get a service plan visibility
    description: |-
      This endpoint retrieves the service plan visibility for a given plan.

      **Permitted roles:** All Roles
    operationId: getServicePlanVisibility
    tags:
      - Service Plan Visibility
    parameters:
      - $ref: ../components/parameters/Guid.yaml
        description: The GUID of the service plan
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ServicePlanVisibility.yaml
            examples:
              default:
                summary: default
                value:
                  type: public
              organization:
                summary: organization restricted
                value:
                  type: organization
                  organizations:
                    - guid: bf7eb420-11e5-11ea-b7db-4b5d5e7976a9
                      name: my_org
              space:
                summary: space restricted
                value:
                  type: space
                  space:
                    guid: ab7eb420-11e5-11ea-b7db-4b5d5e7975ad
                    name: my_space
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
  patch:
    summary: Update a service plan visibility
    description: |-
      This endpoint updates a service plan visibility. It behaves similar to the [POST service plan visibility endpoint](#apply-a-service-plan-visibility) but this endpoint will replace the existing list of organizations when the service plan is `organization` visible.

      **Permitted roles:** Admin
    operationId: updateServicePlanVisibility
    tags:
      - Service Plan Visibility
    parameters:
      - $ref: ../components/parameters/Guid.yaml
        description: The GUID of the service plan
    requestBody:
      $ref: ../components/requestBodies/ServicePlanVisibilityUpdateRequestBody.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ServicePlanVisibility.yaml
            examples:
              default:
                summary: default
                value:
                  type: organization
                  organizations:
                    - guid: 0fc1ad4f-e1d7-4436-8e23-6b20f03c6482
                      name: other_org
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
  post:
    summary: Apply a service plan visibility
    description: |-
      This endpoint applies a service plan visibility. It behaves similar to the [PATCH service plan visibility endpoint](#update-a-service-plan-visibility) but this endpoint will append to the existing list of organizations when the service plan is `organization` visible.

      **Permitted roles:** Admin
    operationId: applyServicePlanVisibility
    tags:
      - Service Plan Visibility
    parameters:
      - $ref: ../components/parameters/Guid.yaml
        description: The GUID of the service plan
    requestBody:
      $ref: ../components/requestBodies/ServicePlanVisibilityCreateRequestBody.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ServicePlanVisibility.yaml
            examples:
              default:
                summary: default
                value:
                  type: organization
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
/v3/service_plans/{guid}/visibility/{organization_guid}:
  delete:
    summary: Remove organization from a service plan visibility
    description: |-
      This endpoint removes an organization from a service plan visibility list of organizations. It is only defined for service plans which are org-restricted. It will fail with a HTTP status code of 422 for any other visibility type (e.g. Public).

      **Permitted roles:** Admin
    operationId: removeOrganizationFromServicePlanVisibility
    tags:
      - Service Plan Visibility
    parameters:
      - $ref: ../components/parameters/Guid.yaml
        description: The GUID of the service plan
      - name: organization_guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The GUID of the organization to remove from the service plan visibility
    responses:
      '204':
        description: No Content
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
