/v3/service_plans:
  get:
    summary: List service plans
    description: |-
      This endpoint retrieves the service plans the user has access to.

      The **organization_guids** and **space_guids** filters do not filter plans that are public. They both act on plans that are restricted to certain organizations, and to plans from space-scoped service brokers.

      **Permitted roles:** All Roles, Unauthenticated Users *(for public plans, unless `hide_marketplace_from_unauthenticated_users` is set)*
    operationId: listServicePlans
    tags:
      - Service Plans
    parameters:
      - name: names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of names to filter by (case-insensitive)
      - name: available
        in: query
        required: false
        schema:
          type: boolean
        description: Filter by the `available` property; valid values are `true` or `false`
      - name: broker_catalog_ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of IDs provided by the service broker for the service plan to filter by
      - name: space_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space GUIDs to filter by
      - name: organization_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization GUIDs to filter by
      - name: service_broker_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service broker GUIDs to filter by
      - name: service_broker_names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service broker names to filter by (case-sensitive)
      - name: service_offering_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service Offering GUIDs to filter by
      - name: service_offering_names
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service Offering names to filter by (case-insensitive)
      - name: service_instance_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of service Instance GUIDs to filter by
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
              - space.organization
              - service_offering
        description: Optionally include a list of unique related resources in the response; valid values are `space.organization` and `service_offering`
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
            - name
            - -name
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`, `name`
      - $ref: ../components/parameters/LabelSelector.yaml
      - name: fields
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            service_offering.service_broker:
              type: string
              description: Comma-delimited list of keys; valid values are `guid`, `name`
        description: |-
          [Fields parameter](#fields-parameter) used to include specific fields of related resources in the response.

          Service plans list fields:

          Resource | Allowed keys
          --- | ---
          `service_offering.service_broker` | `guid`, `name`
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ServicePlanList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 3
                    total_pages: 2
                    first:
                      href: https://api.example.org/v3/service_plans?page=1&per_page=2
                    last:
                      href: https://api.example.org/v3/service_plans?page=2&per_page=2
                    next:
                      href: https://api.example.org/v3/service_plans?page=2&per_page=2
                    previous: null
                  resources:
                    - guid: bf7eb420-11e5-11ea-b7db-4b5d5e7976a9
                      name: my_big_service_plan
                      description: Big plan
                      visibility_type: organization
                      available: true
                      free: false
                      costs:
                        - currency: USD
                          amount: 199.99
