/v3/space_quotas/{guid}:
  get:
    summary: Get a space quota
    description: |-
      This endpoint gets an individual space quota resource.

      **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Manager *(Can only query space quotas owned by affiliated organizations)*, Space Auditor *(Can only query space quotas applied to affiliated spaces)*, Space Developer *(Can only query space quotas applied to affiliated spaces)*, Space Manager *(Can only query space quotas applied to affiliated spaces)*, Space Supporter *(Can only query space quotas applied to affiliated spaces)*

      > **Note:** Response will not show any space guids that a user would not otherwise be able to see (see [space view permissions](#get-a-space)).
    operationId: getSpaceQuota
    tags:
      - Space Quotas
    parameters:
      - $ref: ../components/parameters/Guid.yaml
    responses:
