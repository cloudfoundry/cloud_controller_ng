/v3/space_quotas:
  get:
    summary: List space quotas
    description: |-
      This endpoint lists all space quota resources that the user has permission to view (see [getting a space quota](#get-a-space-quota)).

      **Permitted roles:** All Roles

      > **Note:** Space quotas in the response will not show any space guids that a user would not otherwise be able to see (see [space view permissions](#get-a-space)).
    operationId: listSpaceQuotas
    tags:
      - Space Quotas
    parameters:
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`
      - name: guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space quota guids to filter by
      - name: names
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space quota names to filter by (case-sensitive)
      - name: organization_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of organization guids to filter by
      - name: space_guids
        in: query
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of space guids to filter by
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/SpaceQuotaList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 2
                    total_pages: 1
                    first:
                      href: https://api.example.org/v3/space_quotas?page=1&per_page=50
                    last:
                      href: https://api.example.org/v3/space_quotas?page=1&per_page=50
