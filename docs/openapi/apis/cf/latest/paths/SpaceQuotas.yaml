/v3/space_quotas/{quota_guid}/relationships/spaces:
  post:
    summary: Apply a space quota to a space
    description: |-
      This endpoint applies a space quota to one or more spaces.

      Only an admin or an org manager in the quota's parent organization can apply a space quota to a space.

      **Permitted roles:** Admin, Org Manager *(Can apply space quotas to spaces within their managed organizations)*
    operationId: applySpaceQuota
    tags:
      - Space Quotas
    parameters:
      - name: quota_guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the space quota
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                description: Space guids that the quota will apply to
                items:
                  $ref: ../components/schemas/Relationship.yaml
          examples:
            default:
              summary: default
              value:
                data:
                  - guid: 885735b5-aea4-4cf5-8e44-961af0e41920
                  - guid: 2f35885d-0c9d-4423-83ad-fd05066f8576
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/RelationshipToMany.yaml
            examples:
              default:
                summary: default
                value:
                  data:
                    - guid: 885735b5-aea4-4cf5-8e44-961af0e41920
                    - guid: 2f35885d-0c9d-4423-83ad-fd05066f8576
                    - guid: 45bb0018-c38e-44c9-86d6-155c76803600
                  links:
                    self:
                      href: https://api.example.org/v3/space_quotas/f919ef8a-e333-472a-8172-baaf2c30d301/relationships/spaces
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
/v3/space_quotas/{guid}/relationships/spaces/{space_guid}:
  delete:
    summary: Remove a space quota from a space
    description: |-
      This endpoint removes a space quota from a space.

      Only an admin or an org manager in the quota's parent organization can remove a space quota from a space.

      **Permitted roles:** Admin, Org Manager *(Can remove space quotas from spaces within their managed organizations)*
    operationId: removeSpaceQuotaFromSpace
    tags:
      - Space Quotas
    parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the space quota
      - name: space_guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the space the quota will be removed from
    responses:
      '204':
        description: No Content
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
