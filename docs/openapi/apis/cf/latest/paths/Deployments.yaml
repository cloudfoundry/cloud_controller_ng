/v3/deployments:
  get:
    summary: List deployments
    description: |-
      Retrieve all deployments the user has access to.

      **Permitted roles:** All Roles
    operationId: listDeployments
    tags:
      - Deployments
    parameters:
      - $ref: ../components/parameters/Page.yaml
      - $ref: ../components/parameters/PerPage.yaml
      - name: order_by
        in: query
        required: false
        schema:
          type: string
          enum:
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        description: Value to sort by. Defaults to ascending; prepend with `-` to sort descending. Valid values are `created_at`, `updated_at`
      - $ref: ../components/parameters/CreatedAts.yaml
      - $ref: ../components/parameters/UpdatedAts.yaml
      - $ref: ../components/parameters/LabelSelector.yaml
      - name: app_guids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of app guids to filter by
      - name: states
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-delimited list of states to filter by
      - name: status_reasons
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
              - DEPLOYING
              - PAUSED
              - CANCELING
              - DEPLOYED
              - CANCELED
              - SUPERSEDED
        description: Comma-delimited list of status reasons to filter by; valid values include `DEPLOYING`, `PAUSED`, `CANCELING`, `DEPLOYED`, `CANCELED`, `SUPERSEDED`
      - name: status_values
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
              - ACTIVE
              - FINALIZED
        description: Comma-delimited list of status values to filter by; valid values include `ACTIVE` and `FINALIZED`
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/DeploymentList.yaml
            examples:
              default:
                summary: default
                value:
                  pagination:
                    total_results: 1
                    total_pages: 1
                    first:
                      href: https://api.example.org?page=1&per_page=2
                    last:
                      href: https://api.example.org?page=1&per_page=2
                    next: null
                    previous: null
                  resources:
                    - guid: 123e4567-e89b-12d3-a456-426614174000
                      status:
                        value: FINALIZED
                        reason: DEPLOYED
                        details:
                          last_successful_healthcheck: '2018-04-25T22:42:10Z'
                          last_status_change: '2018-04-25T22:42:10Z'
                      strategy: rolling
                      options:
                        max_in_flight: 1
                      droplet:
                        guid: 123e4567-e89b-12d3-a456-426614174000
                      previous_droplet:
                        guid: 123e4567-e89b-12d3-a456-426614174000
                      new_processes:
                        - guid: 123e4567-e89b-12d3-a456-426614174000
                          type: web-deployment-59c3d133-2b83-46f3-960e-7765a129aea4
                      revision:
                        guid: 123e4567-e89b-12d3-a456-426614174000
                        version: 1
                      created_at: '2018-04-25T22:42:10Z'
                      updated_at: '2018-04-25T22:42:10Z'
                      metadata:
                        labels: {}
                        annotations: {}
                      relationships:
                        app:
                          data:
                            guid: 123e4567-e89b-12d3-a456-426614174000
                      links:
                        self:
                          href: https://api.example.org/v3/deployments/59c3d133-2b83-46f3-960e-7765a129aea4
                        app:
                          href: https://api.example.org/v3/apps/305cea31-5a44-45ca-b51b-e89c7a8ef8b2
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '502':
        $ref: ../components/responses/BadGateway.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
  post:
    summary: Create a deployment
    description: |-
      When you create a new deployment you can either provide a specific droplet or revision to deploy. If no revision or droplet is provided, the droplet associated with the [app](#apps) is deployed.

      **Permitted roles:** Admin, Space Developer, Space Supporter
    operationId: createDeployment
    tags:
      - Deployments
    requestBody:
      description: Deployment object that needs to be created
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - relationships
            properties:
              relationships:
                type: object
                description: Relationships to other resources
                required:
                  - app
                properties:
                  app:
                    $ref: ../components/schemas/RelationshipToOne.yaml
                    description: The app to deploy a droplet for
              droplet:
                $ref: ../components/schemas/Relationship.yaml
                description: The droplet to deploy for the app; this will update the app's [current droplet](#get-current-droplet-association-for-an-app) to this droplet. Defaults to the app's [current droplet](#get-current-droplet-association-for-an-app). Only a droplet *or* a revision may be provided, not both.
              revision:
                $ref: ../components/schemas/Relationship.yaml
                description: The [revision](#revisions) whose droplet to deploy for the app; this will update the app's [current droplet](#get-current-droplet-association-for-an-app) to this droplet. Only a droplet *or* a revision may be provided, not both.
              strategy:
                type: string
                description: The strategy to use for the deployment; supported strategies are `rolling` and `canary` (experimental)
                default: rolling
                enum:
                  - rolling
                  - canary
              options:
                type: object
                description: Options to use for the deployment
                properties:
                  max_in_flight:
                    type: integer
                    description: The maximum number of new instances to deploy simultaneously
                    default: 1
                    minimum: 1
                  web_instances:
                    type: integer
                    description: The number of web instances the deployment will scale to. Defaults to the current web process's instance count
                  memory_in_mb:
                    type: [integer, "null"]
                    description: The amount of memory in megabytes to allocate per web process instance. If `null`, the amount allocated will be taken from the previous web process.
                    default: null
                  disk_in_mb:
                    type: [integer, "null"]
                    description: The amount of disk in megabytes to allocate per web process instance. If `null`, the amount allocated will be taken from the previous web process.
                    default: null
                  log_rate_limit_in_bytes_per_second:
                    type: [integer, "null"]
                    description: Log rate limit in bytes per second to allocate per web process instance. If `null`, the amount allocated will be taken from the previous web process.
                    default: null
                  canary:
                    type: object
                    description: Canary options to use for the deployment. Only valid for deployments with strategy `canary`. (experimental)
                    properties:
                      steps:
                        type: array
                        description: An array of canary steps to use for the deployment. (experimental)
                        items:
                          type: object
                          description: A canary step object
                          properties:
                            instance_weight:
                              type: integer
                              description: The percentage of instances to be deployed as part of the canary process in this step (experimental)
                              minimum: 1
                              maximum: 100
              metadata:
                $ref: ../components/schemas/Metadata.yaml
                description: |-
                  `labels`: Labels applied to the deployment

                  `annotations`: Annotations applied to the deployment
            description: Request schema for creating a deployment
          examples:
            droplet:
              summary: Create a deployment with a droplet
              value:
                droplet:
                  guid: 123e4567-e89b-12d3-a456-426614174000
                strategy: rolling
                relationships:
                  app:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
            default:
              summary: default
              value:
                revision:
                  guid: 123e4567-e89b-12d3-a456-426614174000
                strategy: rolling
                relationships:
                  app:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
    responses:
      '201':
        description: Successfully created deployment
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Deployment.yaml
            examples:
              default:
                summary: default
                value:
                  guid: 123e4567-e89b-12d3-a456-426614174000
                  status:
                    value: ACTIVE
                    reason: DEPLOYING
                    details:
                      last_successful_healthcheck: '2018-04-25T22:42:10Z'
                      last_status_change: '2018-04-25T22:42:10Z'
                    canary:
                      steps:
                        current: 1
                        total: 2
                  strategy: canary
                  options:
                    max_in_flight: 3
                    web_instances: 5
                    memory_in_mb: 1024
                    disk_in_mb: 1024
                    log_rate_limit_in_bytes_per_second: -1
                    canary:
                      steps:
                        - instance_weight: 10
                        - instance_weight: 20
                  droplet:
                    guid: 123e4567-e89b-12d3-a456-426614174000
                  previous_droplet:
                    guid: 123e4567-e89b-12d3-a456-426614174000
                  new_processes:
                    - guid: 123e4567-e89b-12d3-a456-426614174000
                      type: web
                  revision:
                    guid: 123e4567-e89b-12d3-a456-426614174000
                    version: 1
                  created_at: '2018-04-25T22:42:10Z'
                  updated_at: '2018-04-25T22:42:10Z'
                  metadata:
                    labels: {}
                    annotations: {}
                  relationships:
                    app:
                      data:
                        guid: 123e4567-e89b-12d3-a456-426614174000
                  links:
                    self:
                      href: https://api.example.org/v3/deployments/59c3d133-2b83-46f3-960e-7765a129aea4
                    app:
                      href: https://api.example.org/v3/apps/305cea31-5a44-45ca-b51b-e89c7a8ef8b2
                    cancel:
                      href: https://api.example.org/v3/deployments/59c3d133-2b83-46f3-960e-7765a129aea4/actions/cancel
                      method: POST
                    continue:
                      href: https://api.example.org/v3/deployments/59c3d133-2b83-46f3-960e-7765a129aea4/actions/continue
                      method: POST
        links:
          app:
            operationId: getApp
            parameters:
              guid: $response.body#/relationships/app/data/guid
            description: Retrieve the app for this deployment
          droplet:
            operationId: getDroplet
            parameters:
              guid: $response.body#/droplet/data/guid
            description: Retrieve the droplet for this deployment
          previous_droplet:
            operationId: getDroplet
            parameters:
              guid: $response.body#/previous_droplet/data/guid
            description: Retrieve the previous droplet for this deployment
      '400':
        $ref: ../components/responses/BadRequest.yaml
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '409':
        $ref: ../components/responses/Conflict.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
      '500':
        $ref: ../components/responses/500.yaml
      '503':
        $ref: ../components/responses/ServiceUnavailable.yaml
