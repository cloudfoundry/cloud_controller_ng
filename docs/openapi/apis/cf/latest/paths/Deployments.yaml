/v3/deployments/{guid}/actions/cancel:
  post:
    summary: Cancel a deployment
    description: |-
      Cancel a deployment.

      Canceling reverts the application to the state it was in before the deployment started. This involves scaling up the original web process, removing any deployment artifacts, and resetting the current droplet on the application.

      Only a deployment whose **status.value** is `ACTIVE` can be canceled; canceling any other deployment is rejected with a `422 Unprocessable Entity`.

      > **Warning:** There is no guarantee about zero-downtime during a cancel. The goal is to revert to the original state as quickly as possible.

      **Permitted roles:** Admin, Space Developer, Space Supporter
    operationId: cancelDeployment
    tags:
      - Deployments
    parameters:
      - $ref: ../components/parameters/Guid.yaml
        description: The GUID of the deployment
    responses:
      '200':
        description: Successfully canceled deployment; the response has an empty body
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
/v3/deployments/{guid}/actions/continue:
  post:
    summary: Continue a deployment
    description: |-
      Continue a deployment.

      [Canary deployments](https://docs.cloudfoundry.org/devguide/deploy-apps/rolling-deploy.html#canary-deployment-process) deploy a single instance and pause for user evaluation. If the canary instance is deemed successful, the deployment can be resumed via this action. The deployment then continues like a rolling deployment. This feature is experimental and is subject to change.

      Only a paused deployment (**status.value** `ACTIVE` and **status.reason** `PAUSED`) can be continued; continuing any other deployment is rejected with a `422 Unprocessable Entity`.

      **Permitted roles:** Admin, Space Developer, Space Supporter
    operationId: continueDeployment
    tags:
      - Deployments
    parameters:
      - $ref: ../components/parameters/Guid.yaml
        description: The GUID of the deployment
    responses:
      '200':
        description: Successfully continued deployment; the response has an empty body
      '401':
        $ref: ../components/responses/Unauthorized.yaml
      '403':
        $ref: ../components/responses/Forbidden.yaml
      '404':
        $ref: ../components/responses/NotFound.yaml
      '422':
        $ref: ../components/responses/UnprocessableEntity.yaml
