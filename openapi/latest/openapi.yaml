                description: Name of the stack; must be unique and no longer than 250 characters
                maxLength: 250
              description:
                type:
                  - string
                  - 'null'
                description: Description of the stack; must no longer than 250 characters
                maxLength: 250
              metadata:
                $ref: '#/components/schemas/Metadata'
            required:
              - name
