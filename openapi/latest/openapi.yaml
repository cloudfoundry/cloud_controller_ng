                current_droplet:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the current droplet for this app
                droplets:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the droplets for this app
                tasks:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the tasks for this app
                start:
                  $ref: '#/components/schemas/Link'
                  description: The URL to start the app
                stop:
                  $ref: '#/components/schemas/Link'
                  description: The URL to stop the app
                revisions:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the revisions for this app
                deployed_revisions:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the deployed revisions for this app
                features:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the features for this app
            included:
              $ref: '#/components/schemas/IncludedResources'
              description: Additional related resources included in the response when using the include parameter
      description: |
        Apps represent the core entities in the Cloud Foundry environment. They are the deployable units that run your code. Each app can have multiple processes, routes, and services associated with it. Apps can be scaled horizontally by increasing the number of instances. They can also be updated and restarted as needed.
    AppList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/App'
        included:
          $ref: '#/components/schemas/IncludedResources'
          description: Additional related resources included in the response when using the include parameter
    AppEnvironment:
      type: object
      properties:
        staging_env_json:
          type: object
          description: Environment variables used during staging
          additionalProperties: true
        running_env_json:
          type: object
          description: Environment variables used during runtime
          additionalProperties: true
        environment_variables:
          type: object
          description: User-defined environment variables
          additionalProperties:
            type:
              - string
              - 'null'
        system_env_json:
          type: object
          description: System environment variables including VCAP_SERVICES
          additionalProperties: true
        application_env_json:
          type: object
          description: Application environment variables including VCAP_APPLICATION
          additionalProperties: true
      description: Environment variables that will be provided to an app at runtime
    AppEnvironmentVariables:
      type: object
      properties:
        var:
          type: object
          description: Environment variables
          additionalProperties:
            type:
              - string
              - 'null'
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
              description: The URL to get the environment variables for this app
            app:
              $ref: '#/components/schemas/Link'
              description: The URL to get the app for these environment variables
      description: App environment variables with links
    AppPermissions:
      type: object
      properties:
        read_basic_data:
          type: boolean
          description: Whether the user can read basic app data
        read_sensitive_data:
          type: boolean
          description: Whether the user can read sensitive app data
      required:
        - read_basic_data
        - read_sensitive_data
      description: User permissions for an app
    AppSshEnabled:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether SSH is enabled for the app
        reason:
          type: string
          description: If SSH is disabled, describes whether it is disabled globally, at the space level, or at the app level
      required:
        - enabled
      description: SSH enabled status for an app
    Route:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - properties:
            protocol:
              type: string
            host:
              type: string
            path:
              type: string
            port:
              type:
                - integer
                - 'null'
            url:
              type: string
              description: Fully qualified path or address where the route directs traffic
            relationships:
              $ref: '#/components/schemas/Relationships'
            metadata:
              $ref: '#/components/schemas/Metadata'
            links:
              type: object
              properties:
                self:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get this route
                space:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the space for this route
                domain:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the domain for this route
                destinations:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the destinations for this route
            included:
              $ref: '#/components/schemas/IncludedResources'
              description: Additional related resources included in the response when using the include parameter
      description: A route in Cloud Foundry is used to direct traffic from a URL to an application.
    RouteDestination:
      type: object
      properties:
        guid:
          type: string
        app:
          type: object
          properties:
            guid:
              type: string
            process:
              type: object
              properties:
                type:
                  type: string
        weight:
          type:
            - integer
            - 'null'
        port:
          type: integer
        protocol:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
        metadata:
          $ref: '#/components/schemas/Metadata'
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
              description: The URL to get this route destination
            route:
              $ref: '#/components/schemas/Link'
              description: The URL to get the route for this destination
      description: A route destination is a specification for where traffic on a route should be directed.
    RouteDestinationList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/RouteDestination'
      description: A list of route destinations
    Job:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - properties:
            operation:
              type: string
              description: The type of operation the job is performing
            state:
              type: string
              description: The current state of the job
              enum:
                - PROCESSING
                - COMPLETE
                - FAILED
                - POLLING
            errors:
              type: array
              description: Any errors encountered during job execution
              items:
                $ref: '#/components/schemas/Error'
            warnings:
              type: array
              description: Any warnings encountered during job execution
              items:
                $ref: '#/components/schemas/Warning'
            links:
              type: object
              additionalProperties: true
              properties:
                self:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get this job
                manifest:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the manifest for this job
                service_brokers:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the service broker for this job
                service_credential_binding:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the service credential binding for this job
                service_instances:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the service instance for this job
                service_route_bindings:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the service route binding for this job
      description: Jobs are created by the platform when performing certain asynchronous actions. Asynchronous jobs are commonly used for long-running tasks such as uploading large files, staging applications, or deleting resources.
    Error:
      type: object
      properties:
        code:
          type: integer
          description: A numeric code for this error
        detail:
          type: string
          description: Detailed description of the error
        title:
          type: string
          description: Name of the error
    Warning:
      type: object
      properties:
        detail:
          type: string
          description: Description of the warning
    AppUsageEvent:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
      properties:
        state:
          type: object
          properties:
            current:
              type: string
              description: Current state of the app that this event pertains to, if applicable
            previous:
              type:
                - string
                - 'null'
              description: Previous state of the app that this event pertains to, if applicable
        app:
          type: object
          properties:
            guid:
              type: string
              description: Unique identifier of the app that this event pertains to, if applicable
            name:
              type:
                - string
                - 'null'
              description: Name of the app that this event pertains to, if applicable
        process:
          type: object
          properties:
            guid:
              type: string
              description: Unique identifier of the process that this event pertains to, if applicable
            type:
              type: string
              description: Type of the process that this event pertains to, if applicable
        space:
          type: object
          properties:
            guid:
              type: string
              description: Unique identifier of the space that this event pertains to, if applicable
            name:
              type:
                - string
                - 'null'
              description: Name of the space that this event pertains to, if applicable
        organization:
          type: object
          properties:
            guid:
              type: string
              description: Unique identifier of the org that this event pertains to, if applicable
        buildpack:
          type: object
          properties:
            guid:
              type: string
              description: Unique identifier of the buildpack that this event pertains to, if applicable
            name:
              type:
                - string
                - 'null'
              description: Name of the buildpack that this event pertains to, if applicable
        task:
          type: object
          properties:
            guid:
              type: string
              description: Unique identifier of the task that this event pertains to, if applicable
            name:
              type:
                - string
                - 'null'
              description: Name of the task that this event pertains to, if applicable
        memory_in_mb_per_instance:
          type: object
          properties:
            current:
              type: integer
              description: Current memory in MB of the app that this event pertains to, if applicable
            previous:
              type:
                - integer
                - 'null'
              description: Previous memory in MB of the app that this event pertains to, if applicable
        instance_count:
          type: object
          properties:
            current:
              type: integer
              description: Current instance count of the app that this event pertains to, if applicable
            previous:
              type:
                - integer
                - 'null'
              description: Previous instance count of the app that this event pertains to, if applicable
      description: |-
        App usage events are a record of changes in the usage of apps and tasks. Examples include starting an application, scaling an application (from, say, one to three instances), and stopping an application.
        Usage events are typically used by billing and chargeback applications.
    AppUsageEventList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/AppUsageEvent'
    IsolationSegment:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - properties:
            name:
              type: string
              description: The name of the isolation segment
            metadata:
              $ref: '#/components/schemas/Metadata'
            links:
              type: object
              properties:
                self:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get this isolation segment
                organizations:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the organizations for this isolation segment
      description: An isolation segment provides a dedicated pool of compute resources for an organization or space.
    IsolationSegmentList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/IsolationSegment'
    Organization:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - properties:
            name:
              type: string
              description: Name of the organization
            suspended:
              type: boolean
              description: Whether an organization is suspended or not; non-admins will be blocked from creating, updating, or deleting resources in a suspended organization
            relationships:
              type: object
              properties:
                quota:
                  $ref: '#/components/schemas/RelationshipToOne'
              description: The quota applied to the organization
            metadata:
              $ref: '#/components/schemas/Metadata'
            links:
              type: object
              properties:
                self:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get this organization
                domains:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the domains for this organization
                quota:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the quota for this organization
                default_domain:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the default domain for this organization
      description: |
        An org is a development account that an individual or multiple collaborators can own and use. All collaborators access an org with user accounts. Collaborators in an org share a resource quota plan, applications, services availability, and custom domains.
    OrganizationList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
      description: A paginated list of organizations
    OrganizationQuota:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - properties:
            name:
              type: string
              description: Name of the quota
            apps:
              type: object
              description: Quotas that affect applications and application sub-resources
              properties:
                per_process_memory_in_mb:
                  type:
                    - integer
                    - 'null'
                  description: Maximum memory for a single process or task
                total_memory_in_mb:
                  type:
                    - integer
                    - 'null'
                  description: Total memory allowed for all the started processes and running tasks in an organization
                total_instances:
                  type:
                    - integer
                    - 'null'
                  description: Total instances of all the started processes allowed in an organization
                log_rate_limit_in_bytes_per_second:
                  type:
                    - integer
                    - 'null'
                  description: Total log rate limit allowed for all the started processes and running tasks in an organization
                per_app_tasks:
                  type:
                    - integer
                    - 'null'
                  description: Maximum number of running tasks in an organization
            services:
              type: object
              description: Quotas that affect services
              properties:
                paid_services_allowed:
                  type: boolean
                  description: Specifies whether instances of paid service plans can be created
                total_service_instances:
                  type:
                    - integer
                    - 'null'
                  description: Total number of service instances allowed in an organization
                total_service_keys:
                  type:
                    - integer
                    - 'null'
                  description: Total number of service keys allowed in an organization
            routes:
              type: object
              description: Quotas that affect routes
              properties:
                total_routes:
                  type:
                    - integer
                    - 'null'
                  description: Total number of routes allowed in an organization
                total_reserved_ports:
                  type:
                    - integer
                    - 'null'
                  description: Total number of ports that are reservable by routes in an organization
            domains:
              type: object
              description: Quotas that affect domains
              properties:
                total_domains:
                  type:
                    - integer
                    - 'null'
                  description: Total number of domains that can be scoped to an organization
            relationships:
              type: object
              properties:
                organizations:
                  $ref: '#/components/schemas/RelationshipToMany'
              description: A relationship to the organizations where the quota is applied
            metadata:
              $ref: '#/components/schemas/Metadata'
            links:
              type: object
              properties:
                self:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get this organization quota
                organizations:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the organizations for this quota
      description: |
        Organization quotas are named sets of memory, log rate, service, and instance usage quotas. For example, one organization quota might allow up to 10 services, 10 routes, and 2 GB of RAM, while another might offer 100 services, 100 routes, and 10 GB of RAM.
    OrganizationQuotaList:
      type: object
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/OrganizationQuota'
      description: A paginated list of organization quotas
    Package:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - properties:
            type:
              type: string
              description: Type of the package; valid values are bits or docker
              enum:
                - bits
                - docker
            data:
              type: object
              description: Data for package type
              properties:
                error:
                  type:
                    - string
                    - 'null'
                  description: If an error occurs this field will contain the error message
                checksum:
                  type: object
                  properties:
                    type:
                      type: string
                      description: The checksum type, for example sha256
                    value:
                      type:
                        - string
                        - 'null'
                      description: The checksum value; this will be populated after bits are uploaded
                image:
                  type: string
                  description: The registry address of the image
                username:
                  type:
                    - string
                    - 'null'
                  description: The username for the image's registry
                password:
                  type:
                    - string
                    - 'null'
                  description: The password for the image's registry
            state:
              type: string
              description: State of the package; valid states are AWAITING_UPLOAD, PROCESSING_UPLOAD, READY, FAILED, COPYING, or EXPIRED
              enum:
                - AWAITING_UPLOAD
                - PROCESSING_UPLOAD
                - READY
                - FAILED
                - COPYING
                - EXPIRED
            relationships:
              $ref: '#/components/schemas/Relationships'
            metadata:
              $ref: '#/components/schemas/Metadata'
            links:
              type: object
              properties:
                self:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get this package
                upload:
                  $ref: '#/components/schemas/Link'
                  description: The URL to upload the package bits
                download:
                  $ref: '#/components/schemas/Link'
                  description: The URL to download the package bits
                app:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the app for this package
      description: A package represents an application"s "source code" - either raw bits or a pointer to these bits. Packages are used to create builds, which result in a droplet that can be deployed.
    PackageList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Package'
    Process:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - properties:
            version:
              type: string
              format: uuid
              description: Random identifier that changes every time the process will be recreated in the runtime
            type:
              type: string
              description: Process type; a unique identifier for processes belonging to an app
            command:
              type:
                - string
                - 'null'
              description: The command used to start the process; use null to revert to the buildpack-detected or procfile-provided start command
            user:
              type:
                - string
                - 'null'
              description: The user used to run the process; use null to revert to the docker-detected or default 'vcap' user
            instances:
              type: integer
              description: The number of instances to run
            memory_in_mb:
              type:
                - integer
                - 'null'
              description: The memory in MB allocated per instance
            disk_in_mb:
              type:
                - integer
                - 'null'
              description: The disk in MB allocated per instance
            log_rate_limit_in_bytes_per_second:
              type: integer
              description: The log rate in bytes per second allocated per instance
            health_check:
              $ref: '#/components/schemas/HealthCheck'
            readiness_health_check:
              $ref: '#/components/schemas/HealthCheck'
            relationships:
              type: object
              properties:
                app:
                  $ref: '#/components/schemas/RelationshipToOne'
                revision:
                  oneOf:
                    - $ref: '#/components/schemas/RelationshipToOne'
                    - type: 'null'
            metadata:
              $ref: '#/components/schemas/Metadata'
            links:
              type: object
              properties:
                self:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get this process
                scale:
                  $ref: '#/components/schemas/Link'
                  description: The URL to scale this process
                app:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the app for this process
                space:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the space for this process
                stats:
                  $ref: '#/components/schemas/Link'
                  description: The URL to get the stats for this process
      description: A process defines the runnable units of an app
    ProcessList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/Process'
      description: A list of processes
    ProcessStats:
      type: object
      properties:
        resources:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              index:
                type: integer
              state:
                type: string
                enum:
                  - RUNNING
                  - CRASHED
                  - STARTING
                  - DOWN
                  - STOPPING
              host:
                type: string
              uptime:
                type: integer
              mem_quota:
                type:
                  - integer
                  - 'null'
              disk_quota:
                type:
                  - integer
                  - 'null'
              log_rate_limit:
                type:
                  - integer
                  - 'null'
              usage:
                type: object
                properties:
                  time:
                    type: string
                    format: date-time
                  cpu:
                    type: number
                  mem:
                    type: integer
                  disk:
                    type: integer
                  log_rate:
                    type: integer
      description: Statistics for a process
    SecurityGroup:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - properties:
            name:
              type: string
              description: Name of the security group
            globally_enabled:
              type: object
              properties:
                running:
                  type: boolean
                  description: Whether the security group is globally enabled for running apps
                staging:
                  type: boolean
                  description: Whether the security group is globally enabled for staging apps
            rules:
              type: array
              items:
                type: object
                properties:
                  protocol:
                    type: string
                    description: Protocol for the rule
                  destination:
                    type: string
                    description: Destination for the rule
                  ports:
                    type: string
                    description: Ports for the rule
                  type:
                    type: integer
                    description: Type for ICMP rules
                  code:
                    type: integer
                    description: Code for ICMP rules
                  description:
                    type: string
                    description: Description of the rule
              description: Rules for the security group
            running_spaces:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Relationship'
              description: Spaces where this security group is applied to running apps
            staging_spaces:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Relationship'
              description: Spaces where this security group is applied to staging apps
            links:
              type: object
              properties:
                self:
                  $ref: '#/components/schemas/Link'
                running_spaces:
                  $ref: '#/components/schemas/Link'
                staging_spaces:
                  $ref: '#/components/schemas/Link'
            metadata:
              $ref: '#/components/schemas/Metadata'
          required:
            - name
            - globally_enabled
            - rules
            - links
    ServiceBroker:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - properties:
            name:
              type: string
              description: Name of the service broker
            url:
              type: string
              format: uri
              description: URL of the service broker
            relationships:
              type: object
              properties:
                space:
                  $ref: '#/components/schemas/RelationshipToOne'
              description: Relationships for the service broker
            links:
              type: object
              properties:
                self:
                  $ref: '#/components/schemas/Link'
                space:
                  $ref: '#/components/schemas/Link'
                service_offerings:
                  $ref: '#/components/schemas/Link'
            metadata:
              $ref: '#/components/schemas/Metadata'
          required:
            - name
            - url
            - links
    AppCredentialBinding:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - properties:
            type:
              type: string
              enum:
                - app
              description: Type of credential binding
            name:
              type:
                - string
                - 'null'
              description: Name of the credential binding
            last_operation:
              $ref: '#/components/schemas/ServiceCredentialBindingLastOperation'
            relationships:
              type: object
              properties:
                app:
                  $ref: '#/components/schemas/RelationshipToOne'
                service_instance:
                  $ref: '#/components/schemas/RelationshipToOne'
              description: Relationships for the credential binding
            links:
              type: object
              properties:
                self:
                  $ref: '#/components/schemas/Link'
                details:
                  $ref: '#/components/schemas/Link'
                app:
                  $ref: '#/components/schemas/Link'
                service_instance:
                  $ref: '#/components/schemas/Link'
                parameters:
                  $ref: '#/components/schemas/Link'
            metadata:
              $ref: '#/components/schemas/Metadata'
            included:
              $ref: '#/components/schemas/IncludedResources'
              description: Additional related resources included in the response when using the include parameter
          required:
            - type
            - relationships
            - links
    KeyCredentialBinding:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - properties:
            type:
              type: string
              enum:
                - key
              description: Type of credential binding
            name:
              type: string
              description: Name of the credential binding
            last_operation:
              $ref: '#/components/schemas/ServiceCredentialBindingLastOperation'
            relationships:
              type: object
              properties:
                service_instance:
                  $ref: '#/components/schemas/RelationshipToOne'
              description: Relationships for the credential binding
            links:
              type: object
              properties:
