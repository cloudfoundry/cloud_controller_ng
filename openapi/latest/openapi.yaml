    StackList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Stack'
    Task:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseSchema'
        - properties:
            name:
              type: string
            command:
              type: string
            state:
              type: string
              enum:
                - PENDING
                - RUNNING
                - SUCCEEDED
                - FAILED
                - CANCELING
            sequence_id:
              type: integer
            memory_in_mb:
              type:
                - integer
                - 'null'
            disk_in_mb:
              type:
                - integer
                - 'null'
            droplet_guid:
              type: string
            result:
              type: object
              properties:
                failure_reason:
                  type:
                    - string
                    - 'null'
            metadata:
              $ref: '#/components/schemas/Metadata'
            links:
              type: object
              properties:
                self:
                  $ref: '#/components/schemas/Link'
      description: A task is a one-off process that can be run in the Cloud Foundry environment.
    TaskList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    HealthCheck:
      type: object
      properties:
        type:
          type: string
          enum:
            - port
            - process
            - http
          description: The type of health check to perform; valid values are http, port, and process; default is port
        data:
          type: object
          properties:
            timeout:
              type:
                - integer
                - 'null'
              description: The duration in seconds that health checks can fail before the process is restarted
            invocation_timeout:
              type:
                - integer
                - 'null'
              description: The timeout in seconds for individual health check requests for http and port health checks
            interval:
              type:
                - integer
                - 'null'
              description: The interval in seconds between health check requests
            endpoint:
              type: string
              description: The endpoint called to determine if the app is healthy; this key is only present for http health checks
      description: Health check configuration for a process
    RouteList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        included:
          $ref: '#/components/schemas/IncludedResources'
          description: Additional related resources included in the response when using the include parameter
      description: A list of routes
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://uaa.cloudfoundry.local/api-oauth/dialog
          scopes:
            cloud_controller.admin: This scope provides read and write access to all resources
            cloud_controller.admin_read_only: This scope provides read only access to all resources
            cloud_controller.global_auditor: This scope provides read access to all resources
            cloud_controller.read: Read access to the Cloud Controller
            cloud_controller.write: Write access to the Cloud Controller
            cloud_controller.update_build_state: This scope allows its bearer to update the state of a build; currently only used when updating builds
            cloud_controller_service_permissions.read: This scope provides read only access for service instance permissions
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT token authentication
  parameters:
    GUID:
      $ref: '#/components/parameters/Guid'
    guid:
      $ref: '#/components/parameters/Guid'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
      description: Page to display; valid values are integers >= 1
      example: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
      description: Number of results per page, valid values are 1 through 5000
      example: 50
    OrderBy:
      name: order_by
      in: query
      required: false
      schema:
        type: string
      description: |
        Value to sort by. Defaults to ascending; prepend with `-` to sort descending.
      example: created_at
    CreatedAts:
      name: created_ats
      in: query
      required: false
      schema:
        type: string
      description: |
        Timestamp to filter by. When filtering on equality, several comma-delimited timestamps may be passed. Also supports filtering with [relational operators](#relational-operators).
      example: '2021-01-01T00:00:00Z'
    UpdatedAts:
      name: updated_ats
      in: query
      required: false
      schema:
        type: string
      description: |
        Timestamp to filter by. When filtering on equality, several comma-delimited timestamps may be passed. Also supports filtering with [relational operators](#relational-operators).
      example: '2021-01-01T00:00:00Z'
    LabelSelector:
      name: label_selector
      in: query
      description: A query string containing a list of [label selector](#labels-and-selectors) requirements
      required: false
      schema:
        type: string
      example: environment=production
    Guid:
      name: guid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The unique identifier for the resource
    SpaceGuid:
      name: space_guid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The unique identifier for the space
    UserGuid:
      name: guid
      in: path
      required: true
      schema:
        type: string
      description: The unique identifier for the user, matching either a UAA user id or client id. A client id may not be a uuid.
  responses:
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
        text/html:
          schema:
            type: string
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    BuildpackCreateResponse:
      description: Successfully created buildpack
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Buildpack'
    BuildpackGetResponse:
      description: Successfully retrieved buildpack
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Buildpack'
    UserCreateResponse:
      description: User created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    UserUpdateResponse:
      description: User updated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    DropletCreateResponse:
      description: Successfully created droplet
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Droplet'
    DropletGetResponse:
      description: Successfully retrieved droplet
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Droplet'
    RouteCreateResponse:
      description: Route created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Route'
    RouteListResponse:
      description: A list of routes
      content:
        application/json:
          schema:
            type: object
            properties:
              pagination:
                $ref: '#/components/schemas/Pagination'
              resources:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
    RoleCreateResponse:
      description: Role created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Role'
    RoleGetResponse:
      description: Role retrieved
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Role'
    RoleListResponse:
      description: Roles retrieved
      content:
        application/json:
          schema:
            type: object
            properties:
              pagination:
                $ref: '#/components/schemas/Pagination'
              resources:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
              included:
                $ref: '#/components/schemas/IncludedResources'
                description: Additional related resources included in the response when using the include parameter
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    BadGateway:
      description: Bad Gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    TooManyRequests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: integer
                      example: 10008
                    title:
                      type: string
                      example: CF-RateLimitExceeded
                    detail:
                      type: string
                      example: Rate limit exceeded
  requestBodies:
    AppCreateRequestBody:
      description: App object that needs to be created
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Name of the app
              environment_variables:
                type: object
                description: Environment variables to be used for the App when running
                additionalProperties:
                  type: string
              lifecycle:
                $ref: '#/components/schemas/Lifecycle'
                description: Provides the lifecycle object for the application
              relationships:
                type: object
                properties:
                  space:
                    $ref: '#/components/schemas/RelationshipToOne'
                    description: A relationship to a space
                required:
                  - space
              metadata:
                $ref: '#/components/schemas/Metadata'
            required:
              - name
              - relationships
            description: Request schema for creating an app
          examples:
            default:
              summary: default
              value:
                name: my_app
                relationships:
                  space:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
    AppUpdateRequestBody:
      description: App object that needs to be updated
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Name of the app
              environment_variables:
                type: object
                description: Environment variables to be used for the App when running
                additionalProperties:
                  type: string
              lifecycle:
                $ref: '#/components/schemas/Lifecycle'
                description: Lifecycle to be used when updating the app; note `data` is a required field in lifecycle if lifecycle is updated. `type` may NOT be changed from its current value.
              metadata:
                $ref: '#/components/schemas/Metadata'
            description: Request schema for updating an app
          examples:
            default:
              summary: default
              value:
                name: my_app
                lifecycle:
                  type: buildpack
                  data:
                    buildpacks:
                      - java_buildpack
    BuildCreateRequestBody:
      description: Build object that needs to be created
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              package:
                type: object
                properties:
                  guid:
                    type: string
                    format: uuid
                required:
                  - guid
                description: App package to stage
              lifecycle:
                $ref: '#/components/schemas/Lifecycle'
                description: Lifecycle information for a build
              metadata:
                $ref: '#/components/schemas/Metadata'
            required:
              - package
            description: Request schema for creating a build
    BuildpackCreateRequestBody:
      description: Buildpack object that needs to be added
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: The name of the buildpack
              stack:
                type: string
                description: The name of the stack that the buildpack will use
              position:
                type: integer
                description: The order in which the buildpacks are checked during buildpack auto-detection
              lifecycle:
                type: string
                description: The version of buildpack the buildpack will use. `buildpack` indicates [Classic Buildpacks](https://docs.cloudfoundry.org/buildpacks/classic.html). `cnb` indicates [Cloud Native Buildpacks](https://docs.cloudfoundry.org/buildpacks/cnb/)
              enabled:
                type: boolean
                description: Whether or not the buildpack will be used for staging
              locked:
                type: boolean
                description: Whether or not the buildpack is locked to prevent updating the bits
              metadata:
                $ref: '#/components/schemas/Metadata'
            required:
              - name
            description: Request schema for creating a buildpack
          examples:
            default:
              summary: default
              value:
                name: ruby_buildpack
                position: 42
                enabled: true
                locked: false
                stack: windows64
    BuildpackUpdateRequestBody:
      description: Buildpack object that needs to be updated
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: The name of the buildpack
              position:
                type: integer
                description: The order in which the buildpacks are checked during buildpack auto-detection
              enabled:
                type: boolean
                description: Whether or not the buildpack will be used for staging
              locked:
                type: boolean
                description: Whether or not the buildpack is locked to prevent updating the bits
              stack:
                type: string
                description: The name of the stack that the buildpack will use
              metadata:
                $ref: '#/components/schemas/Metadata'
            description: Request schema for updating a buildpack
          examples:
            default:
              summary: default
              value:
                name: ruby_buildpack
                position: 42
                enabled: true
                locked: false
                stack: windows64
    DomainCreateRequestBody:
      description: Domain object that needs to be created
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                description: Name of the domain
              internal:
                type: boolean
                description: Whether the domain is used for internal (container-to-container) traffic
              router_group:
                type: object
                properties:
                  guid:
                    type: string
                    format: uuid
                description: 'The desired router group guid.  _note: creates a `tcp` domain; cannot be used when `internal` is set to `true` or domain is scoped to an org_'
              relationships:
                type: object
                properties:
                  organization:
                    $ref: '#/components/schemas/RelationshipToOne'
                    description: A relationship to the organization the domain will be scoped to;  _note cannot be used when `internal` is set to `true` or domain is associated with a router group_
                  shared_organizations:
                    $ref: '#/components/schemas/RelationshipToMany'
                    description: A relationship to organizations the domain will be shared with  _Note cannot be used without an organization relationship_
              metadata:
                $ref: '#/components/schemas/Metadata'
          examples:
            default:
              summary: default
              value:
                name: example.com
                internal: false
    DomainUpdateRequestBody:
      description: Domain object that needs to be updated
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/Metadata'
            description: Request schema for updating a domain
    DropletCreateRequestBody:
      description: Droplet object that needs to be created
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              relationships:
                type: object
                properties:
                  app:
                    $ref: '#/components/schemas/RelationshipToOne'
                    description: App to create droplet for
                required:
                  - app
              process_types:
                type: object
                description: Process names and start commands for the droplet
              metadata:
                $ref: '#/components/schemas/Metadata'
            required:
              - relationships
            description: Request schema for creating a droplet
          examples:
            default:
              summary: default
              value:
                relationships:
                  app:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                process_types:
                  rake: bundle exec rake
                  web: bundle exec rackup config.ru -p $PORT
    IsolationSegmentCreate:
      description: Isolation segment to create
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Name of the isolation segment; isolation segment names must be unique across the entire system, and case is ignored when checking for uniqueness
              metadata:
                $ref: '#/components/schemas/Metadata'
            required:
              - name
          examples:
            default:
              summary: default
              value:
                name: my_segment
    OrganizationCreateRequestBody:
      description: Organization object that needs to be created
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Organization name
              suspended:
                type: boolean
                description: Whether an organization is suspended or not
              metadata:
                $ref: '#/components/schemas/Metadata'
            required:
              - name
            description: Request schema for creating an organization
          examples:
            default:
              summary: default
              value:
                name: my-organization
    OrganizationUpdateRequestBody:
      description: Organization object that needs to be updated
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Organization name
              suspended:
                type: boolean
                description: Whether an organization is suspended or not
              metadata:
                $ref: '#/components/schemas/Metadata'
            description: Request schema for updating an organization
          examples:
            default:
              summary: default
              value:
                name: my-organization
    OrganizationQuotaCreateRequestBody:
      description: Organization quota object that needs to be created
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Name of the quota
              apps:
                type: object
                description: Quotas that affect applications and application sub-resources
                properties:
                  per_process_memory_in_mb:
                    type:
                      - integer
                      - 'null'
                    description: Maximum memory for a single process or task
                  total_memory_in_mb:
                    type:
                      - integer
                      - 'null'
                    description: Total memory allowed for all the started processes and running tasks in an organization
                  total_instances:
                    type:
                      - integer
                      - 'null'
                    description: Total instances of all the started processes allowed in an organization
                  log_rate_limit_in_bytes_per_second:
                    type:
                      - integer
                      - 'null'
                    description: Total log rate limit allowed for all the started processes and running tasks in an organization
                  per_app_tasks:
                    type:
                      - integer
                      - 'null'
                    description: Maximum number of running tasks in an organization
              services:
                type: object
                description: Quotas that affect services
                properties:
                  paid_services_allowed:
                    type: boolean
                    description: Specifies whether instances of paid service plans can be created
                  total_service_instances:
                    type:
                      - integer
                      - 'null'
                    description: Total number of service instances allowed in an organization
                  total_service_keys:
                    type:
                      - integer
                      - 'null'
                    description: Total number of service keys allowed in an organization
              routes:
                type: object
                description: Quotas that affect routes
                properties:
                  total_routes:
                    type:
                      - integer
                      - 'null'
                    description: Total number of routes allowed in an organization
                  total_reserved_ports:
                    type:
                      - integer
                      - 'null'
                    description: Total number of ports that are reservable by routes in an organization
              domains:
                type: object
                description: Quotas that affect domains
                properties:
                  total_domains:
                    type:
                      - integer
                      - 'null'
                    description: Total number of domains that can be scoped to an organization
              relationships:
                type: object
                properties:
                  organizations:
                    $ref: '#/components/schemas/RelationshipToMany'
                    description: A relationship to the organizations where the quota is applied
              metadata:
                $ref: '#/components/schemas/Metadata'
            required:
              - name
            description: Request schema for creating an organization quota
          examples:
            default:
              summary: default
              value:
                name: production
    OrganizationQuotaUpdateRequestBody:
      description: Organization quota object that needs to be updated
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Name of the quota
              apps:
                type: object
                description: Quotas that affect applications and application sub-resources
                properties:
                  per_process_memory_in_mb:
                    type:
                      - integer
                      - 'null'
                    description: Maximum memory for a single process or task
                  total_memory_in_mb:
                    type:
                      - integer
                      - 'null'
                    description: Total memory allowed for all the started processes and running tasks in an organization
                  total_instances:
                    type:
                      - integer
                      - 'null'
                    description: Total instances of all the started processes allowed in an organization
                  log_rate_limit_in_bytes_per_second:
                    type:
                      - integer
                      - 'null'
                    description: Total log rate limit allowed for all the started processes and running tasks in an organization
                  per_app_tasks:
                    type:
                      - integer
                      - 'null'
                    description: Maximum number of running tasks in an organization
              services:
                type: object
                description: Quotas that affect services
                properties:
                  paid_services_allowed:
                    type: boolean
                    description: Specifies whether instances of paid service plans can be created
                  total_service_instances:
                    type:
                      - integer
                      - 'null'
                    description: Total number of service instances allowed in an organization
                  total_service_keys:
                    type:
                      - integer
                      - 'null'
                    description: Total number of service keys allowed in an organization
              routes:
                type: object
                description: Quotas that affect routes
                properties:
                  total_routes:
                    type:
                      - integer
                      - 'null'
                    description: Total number of routes allowed in an organization
                  total_reserved_ports:
                    type:
                      - integer
                      - 'null'
                    description: Total number of ports that are reservable by routes in an organization
              domains:
                type: object
                description: Quotas that affect domains
                properties:
                  total_domains:
                    type:
                      - integer
                      - 'null'
                    description: Total number of domains that can be scoped to an organization
              metadata:
                $ref: '#/components/schemas/Metadata'
            description: Request schema for updating an organization quota
    PackageCreateRequestBody:
      description: Package object that needs to be created or copied. When copying (source_guid query parameter is provided), only relationships.app is required. When creating a new package, type and relationships.app are required.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                type: string
                description: Type of the package; valid values are bits or docker. Required when creating a new package (when source_guid is not provided). Not required when copying a package (when source_guid is provided).
                enum:
                  - bits
                  - docker
              data:
                type: object
                description: Data for package type
                properties:
                  image:
                    type: string
                    description: The registry address of the image (for docker packages)
                  username:
                    type: string
                    description: The username for the image's registry (for docker packages)
                  password:
                    type: string
                    description: The password for the image's registry (for docker packages)
              relationships:
                type: object
                properties:
                  app:
                    $ref: '#/components/schemas/RelationshipToOne'
                    description: A relationship to an app
                required:
                  - app
              metadata:
                $ref: '#/components/schemas/Metadata'
            required:
              - relationships
            description: Request schema for creating a package
          examples:
            buildpack_app:
              summary: buildpack app
              value:
                type: bits
                relationships:
                  app:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
            docker_app:
              summary: Docker app
              value:
                type: docker
                relationships:
                  app:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                data:
                  image: registry/image:latest
                  username: username
                  password: password
    PackageUpdateRequestBody:
      description: Package object that needs to be updated
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              metadata:
                $ref: '#/components/schemas/Metadata'
              username:
                type: string
                description: The username for the image’s registry. Only possible for Docker package.
              password:
                type: string
                description: The password for the image’s registry. Only possible for Docker package.
            description: Request schema for updating a package
    PackageUploadRequestBody:
      description: Package bits to be uploaded
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              bits:
                type: string
                format: binary
              resources:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceMatch'
    ProcessUpdateRequestBody:
      description: Process object that needs to be updated
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              command:
                type:
                  - string
                  - 'null'
                description: The command used to start the process; use null to revert to the buildpack-detected or procfile-provided start command
              health_check:
                $ref: '#/components/schemas/HealthCheck'
                description: The health check to perform on the process
              readiness_health_check:
                $ref: '#/components/schemas/HealthCheck'
                description: The readiness health check to perform on the process
              metadata:
                $ref: '#/components/schemas/Metadata'
            description: Request schema for updating a process
          examples:
            default:
              summary: default
              value:
                command: rackup
                metadata:
                  labels:
                    key: value
                  annotations:
                    note: detailed information
    RoleCreate:
      description: Role to create
      content:
        application/json:
          schema:
            type: object
