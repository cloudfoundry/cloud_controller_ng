                host: a-hostname
                path: /some_path
                port: 6666
                relationships:
                  domain:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                  space:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
